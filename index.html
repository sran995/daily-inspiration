<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注当下 · Daily Inspiration · Вдохновение</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#faf8f5;--text:#2c2416;--text2:#6b5e4a;
    --accent:#b8860b;--border:#e8e0d3;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1a1814;--text:#e8e0d3;--text2:#a09880;
      --accent:#d4a843;--border:#3a3428;
    }
  }

  body{
    font-family:-apple-system,"Noto Serif SC","PingFang SC",Georgia,serif;
    background:var(--bg);color:var(--text);line-height:1.6;
  }

  /* ── Top Bar ── */
  .topbar{
    display:flex;align-items:center;
    padding:12px 20px;border-bottom:1px solid var(--border);
    font-size:15px;font-weight:600;letter-spacing:1px;
    position:sticky;top:0;background:var(--bg);z-index:10;
  }
  .topbar-left{flex:1;color:var(--text);min-width:0;}
  .topbar-right{flex:0 0 auto;font-size:13px;font-weight:400;color:var(--text2);text-align:right;}

  .unit-badge{
    background:var(--accent);color:#fff;padding:5px 16px;border-radius:20px;
    font-size:13px;letter-spacing:2px;font-weight:600;white-space:nowrap;
    position:absolute;left:50%;transform:translateX(-50%);
  }

  /* ── Quote ── */
  .quote-block{padding:28px 28px 18px;text-align:center;}
  .quote-zh{font-size:clamp(20px,3vw,26px);line-height:1.6;font-weight:500;margin-bottom:12px;}
  .quote-en{font-size:15px;line-height:1.5;margin-bottom:6px;font-family:Georgia,serif;}
  .quote-ru{font-size:15px;line-height:1.5;margin-bottom:14px;}
  .quote-divider{width:32px;height:1px;background:var(--border);margin:0 auto 14px;}

  /* ── Desktop Grid ── */
  @media(min-width:769px){
    .main{
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:auto 1fr;
      max-height:calc(100vh - 52px);max-height:calc(100dvh - 52px);
      overflow:hidden;
    }
    .quote-block{grid-column:1;grid-row:1;}
    .analysis-block{grid-column:1;grid-row:2;overflow-y:auto;padding:0 28px 40px;}
    .right{grid-column:2;grid-row:1/3;}
  }

  /* Analysis */
  .analysis-block{padding:0 20px 28px;}
  .analysis-title{
    font-size:13px;letter-spacing:3px;color:var(--accent);
    margin-bottom:18px;font-weight:600;
  }
  .dim{
    margin-bottom:16px;padding-left:14px;border-left:2px solid var(--border);
  }
  .dim-label{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:1px;}
  .dim-body{font-size:14px;line-height:1.75;color:var(--text2);text-align:justify;}

  /* ── Art Panel ── */
  .right{
    position:relative;background:#1c1c1c;min-height:360px;
    display:flex;align-items:center;justify-content:center;padding:44px 36px 36px 36px;
  }
  .right::before{
    content:"";display:block;position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent);z-index:1;pointer-events:none;
  }
  .art-frame{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  }
  .art-img{
    max-width:100%;max-height:100%;object-fit:contain;
    box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 0 8px #2a2a2a,0 0 0 10px #3a3a3a,0 0 0 44px #1c1c1c;
  }
  .art-overlay{
    position:absolute;inset:0;
    background:linear-gradient(to top,rgba(28,28,28,.85) 0%,transparent 60%);
    pointer-events:none;
  }
  .art-info{
    position:absolute;bottom:0;left:0;padding:28px 24px 22px;color:#fff;z-index:2;
    max-width:55%;
  }
  .art-title{font-size:clamp(14px,1.6vw,18px);font-weight:600;margin-bottom:3px;}
  .art-meta{font-size:11px;opacity:.5;margin-bottom:6px;}
  .art-desc{font-size:12px;opacity:.75;line-height:1.6;}
  .spinner{
    position:absolute;width:28px;height:28px;
    border:2px solid rgba(255,255,255,.15);border-top-color:rgba(255,255,255,.5);
    border-radius:50%;
  }
  @keyframes s{to{transform:rotate(360deg)}}

  /* ── Lightbox ── */
  .lightbox{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
    z-index:999;overflow:hidden;
  }
  .lightbox.open{display:block;}
  .lightbox-stage{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    overflow:auto;
  }
  .lightbox img{
    display:block;transform-origin:center center;
    max-width:none;max-height:none;
  }
  .lightbox-close{
    position:fixed;top:16px;right:24px;color:#fff;font-size:32px;
    cursor:pointer;opacity:.6;z-index:2;line-height:1;
  }
  .lightbox-close:hover{opacity:1;}
  .lightbox-hint{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.4);font-size:13px;z-index:1;
  }
  .lightbox-zoom{position:fixed;bottom:20px;right:24px;display:flex;gap:8px;z-index:2;}
  .lightbox-zoom button{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;
    width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;
    transition:background .2s;
  }
  .lightbox-zoom button:hover{background:rgba(255,255,255,.25);}

  /* ── Mobile ── */
  @media(max-width:768px){
    .topbar{
      padding:10px 16px;font-size:14px;
      flex-wrap:wrap;row-gap:8px;
    }
    .topbar-left{font-size:14px;}
    .topbar-right{font-size:12px;}
    .unit-badge{
      position:relative;left:auto;transform:none;
      font-size:11px;padding:4px 12px;letter-spacing:1px;
      margin:0 auto;
    }

    .quote-block{padding:28px 18px 18px;}
    .quote-zh{font-size:20px;}
    .quote-en{font-size:15px;}
    .quote-ru{font-size:15px;}

    .right{padding:20px;min-height:300px;}
    .art-img{
      box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 0 4px #2a2a2a,0 0 0 5px #3a3a3a,0 0 0 28px #1c1c1c;
    }
    .art-info{padding:18px 14px 16px;max-width:75%;}
    .art-desc{font-size:11px;}

    .analysis-block{padding:0 16px 28px;}
    .analysis-title{font-size:12px;text-align:center;}
    .dim-body{font-size:13px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-left">专注当下 · Daily Inspiration</span>
  <span class="unit-badge" id="unitBadge"></span>
  <span class="topbar-right date-str" id="dateStr"></span>
</div>

<div class="main">
  <div class="quote-block">
    <div class="quote-zh" id="qZh"></div>
    <div class="quote-en" id="qEn"></div>
    <div class="quote-ru" id="qRu"></div>
    <div class="quote-divider"></div>
  </div>

  <div class="right" id="rightPanel">
    <div class="art-frame">
      <img class="art-img" id="artImg" alt="" referrerpolicy="no-referrer" crossorigin="anonymous">
    </div>
    <div class="art-overlay"></div>
    <div class="spinner" id="spinner"></div>
    <div class="art-info">
      <div class="art-title" id="artTitle"></div>
      <div class="art-meta" id="artMeta"></div>
      <div class="art-desc" id="artDesc"></div>
    </div>
  </div>

  <div class="analysis-block">
    <div class="analysis-title">专家视角 · Expert Analysis</div>
    <div id="dims"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close">&times;</div>
  <div class="lightbox-stage" id="lightboxStage">
    <img id="lightboxImg" src="" alt="">
  </div>
  <div class="lightbox-zoom">
    <button id="zoomOut">−</button>
    <button id="zoomIn">+</button>
  </div>
  <div class="lightbox-hint">滚轮缩放 · 点击空白关闭 · Scroll to zoom · Click to close</div>
</div>

<script>
// ═══════════════════════════════════════════
// UNIT CONFIG — 9 units × 2 months each
// ═══════════════════════════════════════════

const UNITS = [
  { name:"文艺复兴",nameEn:"Renaissance",tag:"人文精神的觉醒",startYear:2026,startMonth:5,dims:"western" },
  { name:"巴洛克 · 荷兰黄金时代",nameEn:"Baroque & Dutch Golden Age",tag:"光影戏剧的巅峰",startYear:2026,startMonth:7,dims:"western" },
  { name:"浪漫主义",nameEn:"Romanticism",tag:"情感的解放，自然的敬畏",startYear:2026,startMonth:9,dims:"western" },
  { name:"印象派",nameEn:"Impressionism",tag:"光与色的革命",startYear:2026,startMonth:11,dims:"western" },
  { name:"后印象派",nameEn:"Post-Impressionism",tag:"从画所见到画所感",startYear:2027,startMonth:1,dims:"western" },
  { name:"浮世绘",nameEn:"Ukiyo-e",tag:"东方美学的世界回响",startYear:2027,startMonth:3,dims:"western" },
  { name:"象征主义 · 表现主义",nameEn:"Symbolism & Expressionism",tag:"内心世界的视觉化",startYear:2027,startMonth:5,dims:"western" },
  { name:"超现实主义",nameEn:"Surrealism",tag:"梦境与现实的边界",startYear:2027,startMonth:7,dims:"western" },
  { name:"中国画传统",nameEn:"Chinese Painting",tag:"笔墨、气韵、留白、意境",startYear:2027,startMonth:9,dims:"chinese" }
];

// ═══════════════════════════════════════════
// PAINTINGS
// ═══════════════════════════════════════════

const PAINTINGS_DATA = {

  // ── Unit 0: 文艺复兴 ──
  renaissance: [
    {
      title:"Mona Lisa",titleCn:"蒙娜丽莎",artist:"Leonardo da Vinci",artistCn:"列奥纳多·达·芬奇",year:"1503–1506",size:"77 cm × 53 cm",location:"法国巴黎 · 卢浮宫 Musée du Louvre",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/1280px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg",
      desc:"达·芬奇耗时十余年创作的传世肖像。画中女子神秘的微笑和柔和的渐隐法（sfumato）技法，让这幅画成为西方艺术史上最富传奇色彩的作品。",
      comp:"金字塔式三角构图——头、双肩、双手形成一个稳定的等腰三角形，这是文艺复兴肖像画的经典范式。背景左右两边的地平线并不对齐，左侧稍低，造成微妙的视觉偏移，让静态的坐姿暗含了一丁点儿不对称的动感。空气透视法让远景渐渐消融在淡蓝雾霭中——这就是 sfumato（渐隐法），达·芬奇独创的'无轮廓线条'。远山的模糊与面部的清晰形成层次纵深。",
      light:"光线从左侧斜上方 45° 照来，这是达·芬奇偏爱的'四分之三光源'。光线极其柔和，不产生强烈阴影，而是让面部过渡犹如烟雾般消散——sfumato 在意大利语里就是'如烟'的意思。这种光让五官的明暗过渡没有明确边界，眼角、嘴角都蒙着一层暧昧的光晕。",
      color:"整幅画几乎只有三个色系：皮肤暖赭、衣裙棕褐、背景青绿。这种极简配色让视线无处可逃——只能反复回到那双眼睛。背景的冷绿与肌肤的暖棕形成温差的张力，让人物从画布里'浮'出来。500 年氧化让画面蒙上了一层均匀的琥珀色，恰好增添了神秘感。",
      detail:"右手搭在左手腕上——这个姿势在当时全意大利的年轻女性肖像中反复出现，是优雅与内敛的标志。但达·芬奇画的手比真人更长、更柔，关节处没有一根硬线。你可以试着只遮挡住双手再看这幅画——人物的气场立刻弱了一大半。",
      bg:"达·芬奇1503年回到佛罗伦萨，接受了丝绸商人Francesco del Giocondo的委托，画他的妻子Lisa。但他画了十几年不停笔——这在当时极其罕见。画没交付，他一直带在身边直到去世。文艺复兴时期，艺术家正从工匠变为'创造者'，达·芬奇用这幅画证明了画家不是照相机，而是哲学家。",
      why:"它定义了'肖像画可以是什么'的边界。在蒙娜丽莎之前，肖像画就是记录长相；在这之后，肖像画可以是一个谜——没有明确情绪的微表情反而成了最耐人寻味的表情。1911年它被盗轰动世界；杜尚给她画胡子，安迪·沃霍尔把她丝网印刷——每一次艺术史转折点都绕不开这幅画。它就是西方艺术最著名的'文化符号'，没有之一。"
    },
    {
      title:"The Birth of Venus",titleCn:"维纳斯的诞生",artist:"Sandro Botticelli",artistCn:"桑德罗·波提切利",year:"1485–1486",size:"172.5 cm × 278.9 cm",location:"意大利佛罗伦萨 · 乌菲兹美术馆 Galleria degli Uffizi",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg/1280px-Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg",
      desc:"爱与美的女神维纳斯从海中升起，站在贝壳之上，被风神和春神迎接。波提切利用流动的线条和梦幻般的色调，捕捉了一个神圣而柔美的瞬间。",
      comp:"人物几乎排成了一条从左到右的飘带——左侧风神Zephyr和微风女神Aura抱在一起，吹出的风向右推送着贝壳上的维纳斯；右侧春神Horae手持花袍迎接。维纳斯正好在黄金分割线上。所有人物的手势、飘带、发丝都朝向同一个方向，形成了一种'风的方向感'。",
      light:"这幅画的光源不明确——不像文艺复兴盛期的明暗对比那么强烈。波提切利用了接近浅浮雕的均匀漫射光，让人物轮廓清晰但不产生深影。这种'没有明确光源'的画法让整个场景更接近梦境而非现实。皮肤的珍珠白是波提切利的标志——他画人就像画大理石。",
      color:"冷色调统治全画：粉绿的海、淡蓝的天、象牙白的肌肤。唯一暖的是维纳斯飘动的金色长发和Horae手中花袍上的红色花朵。波提切利用蛋彩而非油画，颜料的透明度更高，色彩更平面、更装饰性——这更像是挂毯而非一扇'窗'。",
      detail:"维纳斯的脖子——长得不自然，左肩的角度在解剖学上也'错了'。波提切利明知不对却不改，因为这是他心中的理想比例：修长、优雅、不食人间烟火。第二个细节：她站着的贝壳——Venus scallop在中世纪是朝圣的象征，波提切利用文艺复兴的异教女神形象讲了一个基督教叙事：美，也是一种神圣。",
      bg:"这是美第奇家族洛伦佐的堂弟洛伦佐·迪·皮耶尔弗朗切斯科委托的作品，挂在他的乡间别墅里。1480年代的佛罗伦萨在美第奇的庇护下，新柏拉图主义盛行——认为古典神话不是异教，而是对'神圣之美'的另一种表达。波提切利用这幅画挑战了'裸体画只能画圣经人物'的传统——他用异教女神合法化了'美'本身。",
      why:"它是文艺复兴早期最大胆的裸体画——不是亚当夏娃，不是圣母，而是一位异教女神。在此之前近千年，西方艺术几乎没有全裸的女性正面形象出现在大型画布上。它打开了一扇门：从此画家可以画神话、画美、画'人'本身。"
    },
    {
      title:"The Creation of Adam",titleCn:"创造亚当",artist:"Michelangelo",artistCn:"米开朗基罗",year:"1508–1512",size:"280 cm × 570 cm",location:"梵蒂冈 · 西斯廷教堂 Sistine Chapel",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Michelangelo_-_Creation_of_Adam_%28cropped%29.jpg/1280px-Michelangelo_-_Creation_of_Adam_%28cropped%29.jpg",
      desc:"西斯廷教堂天顶画中最著名的场景。上帝与亚当的手指即将触碰的那一瞬，凝聚了人类对生命起源的全部想象。",
      comp:"两个'三角形'对峙：左侧亚当的躯体向左倾斜，形成下坠的钝角三角；右侧上帝被天使们包裹在一个飘浮的斗篷里，轮廓像极了一个人体大脑的侧切面——米开朗基罗把上帝画成了'智慧本身'。两根食指之间的那几厘米空隙是画面绝对的焦点——全世界所有的线条、所有的力都导向这一道缝。",
      light:"光源来自画外上方（与教堂实际窗户位置对齐），让上帝和天使们从右侧亮起，亚当则处于相对暗面。这种'神侧的光明 vs 人间侧的灰暗'让两根手指之间不仅是空间的缝隙，也是光明与蒙昧的边界。",
      color:"天顶画使用了fresco（湿壁画）技法，颜色鲜艳度受限于矿物颜料在湿灰泥上的渗透。肉色的棕粉与天蓝色的背景形成唯一的色彩对话。米开朗基罗不用繁复配色，因为画在天花板上离地20米——只有强烈的光影对比才能在远处被看清。",
      detail:"上帝的手指是直的、充满张力的、主动的；亚当的手指是微弯的、慵懒的、被动接受着的。米开朗基罗只用了两根手指就讲清了'神与人'的关系：神主动施予，人只是接收。亚当的手腕靠在膝盖上——没有力气，没有姿态，像一个还没完全醒来的生命。",
      bg:"教皇尤利乌斯二世强令米开朗基罗画西斯廷天顶——他本不想接，说自己'不是画家是雕塑家'。1508-1512年他躺在20米高的脚手架上画了近四年，脖子长时间后仰导致肌肉劳损。天顶总面积约500平方米，300多个人物——'创造亚当'只占中央一块，却成了整个文艺复兴最被记住的画面。",
      why:"两个手指之间的那几厘米——是西方艺术史上'留白'最值钱的几厘米。它定义了'戏剧性暂停'（dramatic pause）：最大的张力不是触碰，而是即将触碰的那一瞬间。此后无数的电影、广告、漫画都在引用这个手势——从ET到漫威。"
    },
    {
      title:"The School of Athens",titleCn:"雅典学院",artist:"Raphael",artistCn:"拉斐尔",year:"1509–1511",size:"500 cm × 770 cm",location:"梵蒂冈 · 梵蒂冈博物馆拉斐尔房间 Vatican Museums",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/%22The_School_of_Athens%22_by_Raffaello_Sanzio_da_Urbino.jpg/1280px-%22The_School_of_Athens%22_by_Raffaello_Sanzio_da_Urbino.jpg",
      desc:"拉斐尔将古希腊最伟大的哲学家们汇聚一堂。柏拉图和亚里士多德位于画面中央，苏格拉底、毕达哥拉斯、欧几里得等各在其位。这是文艺复兴人文主义的巅峰表达。",

      bg:"教皇尤利乌斯二世委托年仅27岁的拉斐尔装饰梵蒂冈签字厅——这四个房间日后被称为拉斐尔房间。签字厅当时是教皇的私人图书馆，墙上四幅壁画分别对应知识的四个领域：哲学（雅典学院）、神学、诗歌和法律。拉斐尔只用了两年多就完成了这面墙。",

      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Monet_-_Impression%2C_Sunrise.jpg/1280px-Monet_-_Impression%2C_Sunrise.jpg",
      desc:"整个印象派运动因这幅画面得名。莫奈用凌乱而精准的笔触捕捉了勒阿弗尔港口的日出——橙红的太阳在水面上投下粼粼波光，远处的船只和烟囱若隐若现。这不是'画所见'，而是'画所感'。",
      comp:"莫奈采用了极其大胆的构图——没有传统的焦点透视，没有清晰的轮廓线，整个画面被水平线分为水、港、天三层。太阳是唯一明确的光源，但它的倒影在水中被拆成了无数短促的橙色笔触。左侧的小船和右侧的烟囱形成不对称的平衡，让画面不像'设计过的'，而像'刚好看到的'。",

      color:"莫奈的色板是橙色与蓝灰色的对抗。太阳的暖橙是整个画面唯一的高温色，其余一切——水、雾、船、烟囱——都沉在早晨的冷灰与淡紫中。这种极端的冷暖对比让太阳在画面上'烧'了起来。1872年的评论家嘲笑这幅画'只是一张草图，连墙纸都比它完整'——正是这种'草图感'给了印象派名字和生命。",
      detail:"太阳——它是全画唯一没有'抖动'的形状：一个近乎完美的橙红圆盘。在全幅都模糊、颤动、未完成的笔触里，这个明确、坚定、完整的圆成了画面的轴心。莫奈似乎在说：光本身可以是朦胧的，但光源永远是坚定的。第二个细节：水面上有一道几乎看不见的竖线——那是一根船桅的倒影，暗示港口生活已经苏醒，但莫奈只画它的倒影，不画船本身。",

      desc:"雷诺阿用斑驳的光影画下了巴黎蒙马特一个周日下午的舞会。阳光透过树叶洒在人群身上，每个人都在笑、在跳舞、在交谈。这是印象派最快乐的一幅画——你几乎能听到手风琴的声音。",
      comp:"雷诺阿的构图看似随意实则精密。前景的长凳上坐着几位聊天的人，他们的头形成了一条水平基线；中景的舞者占据了最大的视觉面积，倾斜的身体创造了画面的动感；背景被模糊的人物填满——这种'摄影式的浅景深'在照相术出现后才被画家借用。画面没有中心——或者说，整个画面都是中心：每个角落里都有人在享受周日的阳光。你从左看到右，从右看到左，没有一个地方是'重点'，但每个地方都在'发生'。",
      light:"阳光穿过头顶的刺槐树叶，在地面和人群身上投下斑驳的光斑——这是整幅画的技术核心。雷诺阿花了好几个周日把巨大的画布从画室搬到蒙马特的舞会现场，就为了在真实的树叶下画真实的光斑。人脸、衣服、地面上的光斑颜色从冷白到暖金——同一个光源，经过不同表面的反射，变成了千变万化的颜色。最绝的是：你几乎能'感到'树叶在微风中晃动——因为光斑的边缘是柔和的、晕开的。",
      color:"温暖统治着整个画面：人物的肤色是淡粉和暖棕，地面是金黄与土红，女士的裙子是淡蓝和粉紫——所有颜色都被一层'阳光滤镜'统一了。雷诺阿的色板里几乎不用黑色——暗部是深紫、深蓝、深褐。他说：'阴影不是黑色的，阴影是光的另一种颜色。'那条淡粉色的裙子是画面最吸引眼球的地方——它的冷粉与周围的暖黄形成微妙的补色，让少女从人群中浮现。",
      detail:"前景左侧坐在长凳上的那位少女——她侧脸对着阳光，左脸颊上有一块菱形的光斑。雷诺阿在这块光斑里用了和少女肤色完全不同的冷白，说明那是'刚刚穿过叶隙的光'而不是'她脸上的颜色'。第二个细节：画面正中央偏右，一对舞伴——男士的浅灰西装上落满了树叶的光斑，像穿了一件斑驳的光之衣服。这是只在那一瞬间、那片光下才存在的图案——没人能复制，只有印象派能捕捉。",
      bg:"蒙马特是当时巴黎的郊区，煎饼磨坊（Moulin de la Galette）是工薪阶层周日跳舞的地方——入场费只要25生丁。雷诺阿的画室就在附近。每周日下午他请朋友们帮忙把巨大的画布搬下坡，支在舞池边——路人以为他疯了。模特都是他的朋友和邻居：穿条纹裙的少女是艾斯特尔（他后来的模特），坐在长凳上的蒙马特女孩叫玛格丽特。这不是'题材'——这是他每个星期天亲眼看到的、身处其中的人间烟火。",
      why:"它是印象派的'人间喜剧'——莫奈画自然、德加画排练厅、毕沙罗画街道，而雷诺阿画'幸福本身'。你不需要懂艺术史就能被它感染——阳光、音乐、跳舞的青春———这些是人类共通的语言。它证明了一件重要的事：印象派不只是技术革命（外光画法），也是一种态度——画生活里真实发生的、正在消逝的、值得被记住的快乐。"

      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Claude_Monet_-_The_Water_Lilies_-_The_Clouds_-_Google_Art_Project.jpg/1280px-Claude_Monet_-_The_Water_Lilies_-_The_Clouds_-_Google_Art_Project.jpg",
      desc:"莫奈晚年在他吉维尼花园的池塘边创作了约250幅睡莲，橘园美术馆的两间椭圆形房间里陈列着其中最壮观的八幅巨制。近看是一团团色块，退后一步——光、水、空气都活了。",
      comp:"莫奈在睡莲系列中彻底放弃了线性透视——没有地平线、没有岸边、没有天空。整个画面就是'水面'——睡莲的叶片漂浮在蓝绿交错的水面上，柳树的倒影从画面上方垂下。这种'无天无地'的构图在当时极其激进——你找不到站的位置，你不是'观看睡莲'，你是'身在水中'。橘园美术馆的椭圆展厅就是为这种沉浸感设计的——两间房间的八幅画围成一个环形的水面，观众站在中间，被水与莲包围。",
      light:"光不是从某个方向照来的——光就是水面的反射本身。莫奈画了三种光：天空的散射光（让水面呈现蓝白）、垂柳的倒影（让上方水面变暗绿）、睡莲自身反射的光（花瓣的淡粉和白色）。这三种光交错穿透——水面深处是暗的，但几朵莲花像发光体一样浮在上方。晚年莫奈白内障严重，几乎看不清自己画的颜色——但他凭着半个世纪的肌肉记忆继续画。有人说这时期的色彩更加'内在'了——他画的不再是'眼睛看到的光'，而是'记忆中的光'。",
      color:"莫奈的睡莲色板是一首冷色调交响曲：蓝紫、青绿、淡粉、月白、深蓝。没有红色、没有黄色——整个池塘在清晨或黄昏的柔光里。柳树倒影的深绿和暗紫在画面上方形成'重色压顶'，中下部的睡莲花瓣用厚涂法（impasto）堆叠出鼓起来的一片片白与淡粉。云朵在水面上的倒影不是白色——是淡蓝和淡紫的微妙变奏。",
      detail:"每一朵睡莲花瓣的笔触方向都不一样——莫奈不是'画一朵花'，而是在'画花瓣反射的不同方向的光'。花瓣在亮面是冷白加一抹天蓝（天空的反光），在暗面是暖紫（水底的反射）。如果你盯着看久一点，花好像在水上微微浮动。第二个细节：水面深处的暗色里有隐约的游鱼轮廓——莫奈用比周围水面更暗的几笔暗示了水下有生命。不是'画鱼'，是'画鱼在水下移动时水面的颜色变化'。",
      bg:"莫奈1883年搬进吉维尼，1890年买了自己的房子和土地。他雇了日本园丁按浮世绘的美学设计花园——日本太鼓桥、垂柳、竹林——然后引塞纳河的支流造了一个睡莲池塘。从1899年开始画睡莲，一直画到1926年去世——整整27年。一战期间，德国军队打到离吉维尼不到50公里的地方，莫奈拒绝撤离——他说：'我的兄弟在前线，我的位置在画架前。'1918年停战第二天，莫奈写信给法国总理克列孟梭：'我想把我的睡莲系列捐给国家——作为和平的礼物。'橘园美术馆就是为这组画量身建造的——1927年开幕时莫奈已去世5个月。",
      why:"睡莲是莫奈的'宇宙'——他在一片池塘里找到了无穷无尽的变化：每天的光不同、每个季节的水不同、每一朵花开的位置不同。睡莲系列定义了'系列画'（series）这个现代艺术概念——同一个主题反复画，不是为了'画完'它，而是为了证明：它永远画不完，每一刻都是新的。橘园展厅被称作'印象派的西斯廷教堂'——你走进去，世界安静下来，水面无限延伸。"

      desc:"莫里索是印象派的核心成员，也是第一位在印象派展览中展出的女性画家。这幅画描绘了她的姐姐埃德玛凝视着摇篮中熟睡的女儿——一个母亲看着自己孩子的寻常瞬间，被画成了生命中最温柔的光景。",
      comp:"摇篮的白纱帷幔形成一条从左上到右下的对角斜线——纱帐半透明，隐约可见布兰奇的睡脸。母亲坐在左侧，左手托腮，身体倾向摇篮，形成一个'保护性的弧形'。画面右边的空间是'空'的——这种不对称构图让整个画面的重量都倾倒在摇篮的方向。母亲的右手轻轻放在纱帐的边缘——一个几乎无意识的小动作，暴露了一个母亲时刻准备去安抚孩子的本能。画面极其安静——你甚至不敢大声呼吸，怕吵醒婴儿。",
      light:"光从画面上方（画外的高窗）照下来，穿过摇篮的纱帐后在婴儿的脸上'柔焦'——纱帐像天然的柔光箱。母亲的脸上有一层非常薄的蓝灰半影——因为她的头略微低垂，被纱帘遮掉了一部分光线。莫里索的光不像莫奈那样在'动'——她的光是'停留'的、安静的、室内的。这不是大自然的强光，而是下午两点钟——孩子在午睡时那种慵懒的、静止的柔光。",
      color:"白与蓝是这个画面的两个魂——摇篮的纱白、婴儿的睡裙白、母亲领口的白花边——不同的'白'区分了棉、纱、皮肤三种质感。母亲的蓝灰色衣裙和帷幔上的淡蓝条纹形成呼应——蓝与白的关系就是母爱与婴儿的关系：环绕、托举、不打扰。莫里索的调色板里保留了大量'未混合'的颜色——蓝色纱帘上你能看到不同深浅的蓝笔触并排铺开而不是混匀——这是印象派外光的技巧被她用在了室内。",

      bg:"莫里索出身富裕的法国中产阶级家庭，她的爷爷是弗拉戈纳尔（洛可可大师），但她选择了印象派这条反叛之路。她和马奈是好朋友（后来嫁给了马奈的弟弟尤金），是莫奈、雷诺阿、德加的平等同事——她参加了八届印象派展览中的七届。'摇篮'画的是她的姐姐埃德玛和埃德玛的女儿布兰奇。埃德玛也是一位画家——但结婚生子后放弃了绘画。莫里索用这幅画告诉所有人：婚姻和母性不是女性创造力的终结——而是一个值得被认真对待的主题。",

      color:"黄色——只有黄色。梵高在阿尔勒时期对黄色到了痴迷的程度——'多么美妙的黄色啊！'他一遍遍地对提奥喊。柠檬黄画花瓣的亮面，铬黄画花瓣的中段，赭黄画枯萎的边缘，土黄画桌面和陶罐。他在黄色里找到了整个'光谱'——明暗、冷暖、鲜灰——全在一个色相里完成。唯一的'非黄色'是花心的深棕和暗绿，以及陶罐下缘那条细细的蓝色弧线——这一抹蓝在满幅的黄里像一滴冷水落入沸油，让整个画面的温度更烫了。",
      detail:"左下角那朵完全垂头的向日葵——花盘已经变成暗棕色，花瓣耷拉下来像疲倦的手臂。如果你用手指挡住它，整幅画就是'一束漂亮的黄花的静物'；但加上这朵垂死的花——画面就变成了'生命的过程'。梵高画向日葵从来不去掉枯花——他要的就是'同时看到开放和凋零'。第二个细节：花心（头状花序）——每一个花心的笔触都是螺旋形的、用厚涂法堆起来的，近看是一坨一坨的颜料块。这花心不只是'画出来的'也是'塑出来的'——你能看到梵高的手是怎么转着刷子把颜料堆成圆形的。",
      bg:"1888年2月梵高从巴黎来到法国南部的阿尔勒。巴黎的冬天太灰太暗——他要寻找'日本的阳光'。他在拉马丁广场租了'黄房子'，把外墙也漆成了黄色。他计划建立一个'南方画室'——一个艺术家公社——邀请高更来做'公社的导师'。向日葵系列就是为了装饰高更的房间而画的：'我想用半打向日葵的画来装饰他的卧室——一种蓝色和黄色的交响曲。'高更确实来了——住了两个月，两人一起画画、争论、喝酒。1888年12月23日，梵高在和高更激烈争吵后，用剃刀割下了自己的左耳。高更第二天就走了——'南方画室'的梦碎了。",
      why:"向日葵是梵高的'自画像'——他用花画了自己的一生：灿烂、孤独、燃烧、枯萎，全都在一个花瓶里。1987年，梵高的另一幅向日葵在伦敦佳士得以3990万美元成交——当时创下了艺术品拍卖的世界纪录。这个价格震惊了全世界——他活着时只卖出了一幅画（400法郎），死后一百年，他的花儿卖了四个亿。不是因为花变了，是因为世界终于追上了他的色彩。"
    },
    {
      title:"A Sunday Afternoon on the Island of La Grande Jatte",titleCn:"大碗岛的星期天下午",artist:"Georges Seurat",artistCn:"乔治·修拉",year:"1884–1886",size:"207.5 cm × 308.1 cm",location:"美国芝加哥 · 芝加哥艺术博物馆 Art Institute of Chicago",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Georges_Seurat_-_A_Sunday_on_La_Grande_Jatte_%E2%80%94_1884_-_Google_Art_Project.jpg/1280px-Georges_Seurat_-_A_Sunday_on_La_Grande_Jatte_%E2%80%94_1884_-_Google_Art_Project.jpg",
      desc:"修拉花了两年时间，用几百万个彩色小点组成了一幅3米宽的巨制。巴黎中产阶级周日在塞纳河畔小岛上享受阳光——看画的人越走近，画面越'消失'；退后一步，光与色魔术般重新聚合。这是'点彩法'的终极宣言。",
      comp:"修拉用严格的几何秩序安排了一个看似休闲的场景。所有人物的朝向几乎都是'侧面'或'背面'——没有人与你对视，所有人都像棋子一样被安放在一个精确的网格上。画面被水平线分为河、岸、草三层；垂直方向被前景的暗影（左侧河岸和右侧的撑伞女人）框成一个'舞台'。每个人物之间的距离经过了精密计算——没有一个重叠，孤独感被精确地量化了。前景左下角斜躺着的工人（全画唯一的社会底层）和右侧撑着阳伞的上流社会妇女形成阶层的对角线对比。",
      light:"光在修拉的体系里不是'流'而是'颗粒'——他相信光的混合应该在观众的视网膜上完成，而不是在调色盘上。所以他把颜料分解成无数纯色的小点——蓝点旁边放橙点，远看融合成'带橙味的光'。光不再从某个方向照来——整幅画的光是'没有空气的、永恒的、午后的均匀漫射'。影子也不是黑色——是深紫和暗蓝的点与地面的绿色点在视觉上混合。如果你凑得足够近（30厘米以内），你能看到每一笔'原子'——这是物理学式的光：光就是波，颜色就是波长。",
      color:"修拉的色板来自化学家谢弗勒尔的色彩理论：红与绿互补、橙与蓝互补、黄与紫互补。他在大面积的绿色草地上散布了无数细小的红点和橙点——远看你的视网膜会把它们'调和'成一种更'活'的绿。人物的衣服是冷蓝、灰紫、暗棕——大面积的中性色被天空和水面的亮黄、亮蓝、亮白点燃。画面四边有一圈修拉后来加上的'点彩画框'——用更密更小的点画成的红色和蓝色带，像一个色彩实验室的边界。",
      detail:"画面正中央偏右——一个穿白裙的小女孩，她是全画唯一正面面对观众的人物。所有大人都在侧面和背面——只有这个孩子正对着你，像在问：'你在看什么？'她也是全画最亮的'白色'——但近看你会发现那白裙没有一笔是纯白颜料——它是淡蓝、淡粉、淡黄的点交织在画布上。远看是'白裙'，近看是一张彩色星空。第二个细节：右下角一只猴子——一个上流社会的女人牵着它。猴子在19世纪的巴黎经常出现在妓院和讽刺画里——修拉把它放在星期天下午的'正经家庭'旁边，暗示这个表面体面的社会底下有没被说出来的故事。",
      bg:"1884年修拉才25岁，他已经在研究光学和色彩理论——不是一个画家的方式，而是一个科学家的方式。他读了谢弗勒尔、鲁德和查尔斯·布朗的论文，把画室变成了实验室。大碗岛是巴黎西郊塞纳河中的一个小岛，星期天下午中产阶级在这里聚会、散步、划船、调情——是19世纪末巴黎'现代生活'的标准布景。修拉每周日去岛上画速写和色彩笔记，回到画室在巨大的画布上用两年时间一针一针地'绣'这幅画。1886年春天，它在第八届印象派展览上展出——25岁的修拉一下子站到了印象派的对立面：印象派要'瞬间'，他要'永恒'；印象派要'直觉'，他要'系统'。",
      why:"它开启了'后印象派'和后印象派的'科学派'——证明了绘画不一定要靠直觉和才气，也可以靠系统和智慧。修拉只活了31岁（1891年死于白喉），但他用短暂一生画出了一条新路——从塞尚的'用圆柱体和球体看世界'到蒙德里安的几何抽象，再到数字艺术的像素化美学，全都可以追溯到大碗岛下午的这些彩色小点。芝加哥艺术博物馆里，每天都有人站在它面前发呆——远看、近看、再远看——修拉设计的'视网膜游戏'130年后依然有效。"
    },
    {
      title:"Mont Sainte-Victoire",titleCn:"圣维克多山",artist:"Paul Cézanne",artistCn:"保罗·塞尚",year:"1902–1906",size:"73 cm × 91.9 cm",location:"美国普林斯顿 · 普林斯顿大学艺术博物馆 Princeton University Art Museum",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Paul_C%C3%A9zanne_-_Mont_Sainte-Victoire_-_Google_Art_Project.jpg/1280px-Paul_C%C3%A9zanne_-_Mont_Sainte-Victoire_-_Google_Art_Project.jpg",
      desc:"塞尚晚年反复画他家附近的圣维克多山——同一个主题他画了超过80次。没有人物、没有故事、没有戏剧——只有一座山、一片天、一些树和房子。但在这幅画里，塞尚做了一件改变艺术史的事：他把风景拆成了几何块面，每一块颜色都是'建筑'画面的一块砖。",
      comp:"塞尚把整个画面分解成了色块的拼图——天空不是'一片'而是深浅不同的蓝灰方块拼起来的；山体不是'一座'而是由蓝紫、土黄、淡绿三个色调的几何面叠成的棱锥；前景的树被简化成深绿色的圆柱和圆球；房屋是橙黄的立方体在绿色中浮现。没有空气透视——远处的山和近处的树用了同等程度的清晰度——因为塞尚要的不是'远的模糊'而是'结构的永恒'。他打破了五百年的单点透视——你可以在画面里找到多个灭点——好像你在看这幅画的时候同时在移动。",
      light:"塞尚的光不讲'感觉'，讲'结构'。没有莫奈那种颤动的光斑，没有梵高的螺旋光——光在塞尚笔下是'固体的'。他用色彩的冷暖交替来暗示体块：山的受光面是暖黄和淡橙，背光面是冷蓝和灰紫——但冷暖之间的过渡不是柔和的渐变，而是'硬切'的色块边界。他拒绝使用传统明暗法（chiaroscuro）——不用黑色制造阴影，而是用蓝紫和深绿这些'冷暗'色来替代。这就是塞尚所说的：'用色彩来塑造形体。'",
      color:"塞尚的色板是普罗旺斯的颜色——地中海阳光下褪了色的蓝灰天空、干草般的沙黄麦田、远山上的淡紫雾霭、松柏的墨绿。他用有限的颜色做了无限的分割——画面里几乎没有一块颜色和旁边那块完全相同。每一块颜色都同时做三件事：描绘物体（这是山）、暗示光线（这是受光面）、支撑结构（这块蓝色把山体从天空'推'出来）。蓝色不仅仅画天空——它还出现在山体的暗面、树影的深处、甚至房屋的阴影中，把整幅画用蓝色'缝'在了一起。",
      detail:"画面右下角——一棵孤独的深绿松树，树干用两笔暗褐写成，树冠是厚涂的墨绿圆球。这棵树在画面中的位置极其关键：它是唯一的绝对前景——没有它，画面就是'从某个不确定的距离看山'；有了它，你就站在了树后面——你的'观看位置'被这棵树钉死了。第二个细节：圣维克多山顶部的石灰岩——塞尚用淡蓝白和淡紫灰交替的画法，让山顶在天空的背景里'摇摆'——到底是天空在后退还是山在前进？这种'体块与空间之间的搏斗'就是塞尚全部艺术的终极问题。",
      bg:"塞尚1859年来到巴黎，被沙龙拒绝了二十多年。印象派的朋友们觉得他'太奇怪'——他不画光，他画体积。左拉是他从小一起长大的最好的朋友——1886年左拉出版小说《杰作》，写了一个失败的画家，塞尚认为那是在写他，和左拉彻底决裂。他回到普罗旺斯的艾克斯，把自己关在画室里，画苹果、画山、画他老婆（40多幅肖像，每一幅她都没有笑容——因为她当模特时经常睡着，塞尚咆哮：'不要动！苹果会动吗！'）。他1886年父亲去世，留给他一大笔遗产，他终于不用为钱发愁——从此每天画画，不卖、不展、不社交。晚年他每天走两公里到山上，支起画架对着圣维克多山画一整天。1906年10月，67岁的塞尚在山上画画时被暴雨淋湿，昏迷在路边——一周后死于肺炎。他死的时候，口袋里还装着一管没挤完的群青。",
      why:"塞尚是所有现代艺术之父——这句话不过分。毕加索说：'塞尚是我的一个唯一的老师……我花了二十年研究他。'马蒂斯说：'塞尚是我们所有人的父亲。'他证明了：绘画不是'复制自然'，而是'用画面重建一个平行于自然的秩序'。从立体主义（把物体拆成几何面）到抽象艺术（放弃物象只保留色块关系）——每一条路都通向塞尚。他画了一辈子的苹果和山，就是想说一句话：'用圆柱体、球体、圆锥体去理解自然。'立体主义和抽象表现主义的起点就在这里。"
    },
    {
      title:"Where Do We Come From? What Are We? Where Are We Going?",titleCn:"我们从哪里来？我们是谁？我们到哪里去？",artist:"Paul Gauguin",artistCn:"保罗·高更",year:"1897–1898",size:"139.1 cm × 374.6 cm",location:"美国波士顿 · 波士顿美术馆 Museum of Fine Arts, Boston",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Paul_Gauguin_-_D%27ou_venons-nous.jpg/1280px-Paul_Gauguin_-_D%27ou_venons-nous.jpg",
      desc:"高更在大溪地——远离欧洲文明的南太平洋小岛上——画下了这幅'人生三部曲'的巨型壁画式长卷。从右到左：婴儿诞生（我们从哪里来）、青年男女日常劳作（我们是谁）、垂暮老妇等待死亡（我们到哪里去）。这是高更最野心勃勃的作品——他用塔希提人的身体画了一部西方哲学的终极追问。",
      comp:"高更将画面从右到左设计为一个'阅读的方向'——一条跨越整个人生的时间线。最右侧：三个女人围着一个熟睡的婴儿——生命的起点，婴儿在金色光晕中像一个圣婴。中间部分：一个年轻人正在摘果子——这是全画的'核心动作'，果子就是人生的'欲望与选择'；左侧一个青年女子坐着凝视前方，像一个'正在决定人生方向的人'。最左侧：一个枯瘦的老人蜷缩在角落，双手掩面——她旁边有一只白色的鸟，嘴里衔着一只蜥蜴，这是塔希提神话中'死亡时刻'的象征。背景里那尊蓝色的神像（塔希提女神Hina）俯瞰着这一切——她是生与死的见证者。",
      light:"高更的光不像印象派那样'观察自然光'——他的光是一种设计过的、均匀的、装饰性的光辉。婴儿周围有金色光晕，像是从婴儿自身发出的。画面最左侧的死亡区域用暗蓝和深绿笼罩——'光'在随着人生进程而消退。中景的水面反射出一种孔雀蓝的冷光——不是真实的热带阳光，而是一种象征性的'精神之光'。整幅画的光不来自任何一个具体方向——它是高更心中的'理想之光'，平铺在所有人物上。",
      color:"高更用色大胆到了'反自然'的程度：草地可以是粉红色的，水面可以是孔雀蓝，人物的皮肤是深棕和金赭——这是一个被主观色彩重新定义的世界。他刻意远离印象派的'真实色彩'——他说：'如果你看到一棵树是蓝色的，就把它画成蓝色。'这幅画的色彩来自塔希提的热带阳光、法国中世纪彩色玻璃窗的平面色块、日本浮世绘的平涂技巧——三重影响交汇成高更独有的'色彩体系'。",
      detail:"画面中央——一个年轻人正在伸手摘树上的一个果子。这个动作只占了画面不到十分之一，但它是全画的精神枢纽——'摘果子'就是'人生的选择'。果子是青绿色的——只有一个，不高不低，刚好够他踮踮脚够到。高更在这一个手势里放进了整个人生的隐喻：你要伸出手才能得到——但果子只有一个，摘了就没了。第二个细节：画面最右侧地上坐着的一只黑狗——高更在给朋友的信中解释说：狗代表'动物的无知'——它不知道'出生'意味着什么。狗和婴儿并置——一个知道'活着'，一个不知道'出生了'。",
      bg:"1897年冬天，高更49岁，在大溪地已经待了六年。他最爱的女儿阿丽妮在法国死于肺炎——消息隔了好几个月才传到岛上。他身无分文、梅毒缠身、和当地殖民政府关系极其恶劣。他决定画一幅'终极作品'——画完之后就自杀。他在这幅画上连续画了将近一个月，几乎不吃不睡。完成后他走上山，吃下了砒霜——剂量太大，他开始呕吐，没死成。'我活下来了，'他后来写道，'但我的灵魂的一部分已经在那次呕吐中死去了。'他继续活了五年——1903年死在马克萨斯群岛，终年54岁。死时身边只有塔希提邻居，没有欧洲人。",
      why:"它把'哲学'画成了'可以看的'。高更用塔希提人的身体、热带的色彩、波利尼西亚的神像——所有来自'非欧洲'的语言——画了一个纯粹西方的哲学追问。这在19世纪末的欧洲是不可想象的：'野蛮人'凭什么思考终极命题？高更的回答是：谁都可以——不是用笛卡尔的推论和康德的范畴，而是用阳光、海浪、果子、爱、老和死。他在写给朋友的信中说：'我相信这幅画超越了我之前的所有作品——也许比我以后要画的都好。'他没说错。"
    },
    {
      title:"At the Moulin Rouge",titleCn:"红磨坊",artist:"Henri de Toulouse-Lautrec",artistCn:"亨利·德·图卢兹-劳特累克",year:"1892–1895",size:"123 cm × 140 cm",location:"美国芝加哥 · 芝加哥艺术博物馆 Art Institute of Chicago",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg/1280px-Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg",
      desc:"劳特累克是蒙马特的'局内人'——他每天晚上坐在红磨坊的夜总会里，画舞女、画酒客、画霓虹灯下每一个不被白天记住的人。这幅画里他自己也出现了——矮小的身材、圆顶礼帽，走在人群边缘。这不是观察者的画，是参与者的画。",
      comp:"劳特累克用了一条从右下到左上的对角斜线来组织整个空间——右侧桌面的边线和左侧墙壁的延伸形成三角形的'推深'。前景右侧的一大片桌面是被'切断'的——只有半张桌子、半把椅子、一个女人的半张脸。这种'裁切式'构图来自德加和日本浮世绘的影响，但劳特累克比德加更进一步——他裁掉的不是无关的东西，而是观众期望看到的东西。画面最远处的一面大镜子里的绿色反光，提供了整个空间深度——你看到的人的背后还有更远处的人的倒影。",
      light:"红磨坊的光是人工的、下流的、肮脏的——煤气灯的黄绿光从画面外上方打来，让每个人的脸色都带着一种'不健康'的灰绿。劳特累克不美化光——他画的光和这个场所本身一样：廉价、刺目、让所有人的皮肤颜色都'错了'。舞女的脸部在灯光下是绿白相间的斑驳——不是舞台妆的高贵，而是煤气灯下油脂和粉底的狼狈。远处镜子里的反光是整个画面最亮的部分——它在提醒你：这一切只是镜花水月。",
      color:"劳特累克的色彩是'夜晚的颜色'——墨绿、暗红、土棕、灰紫——偶尔几笔舞女裙摆上的朱红和橙黄在暗色中跳出来，像夜总会里的霓虹招牌。他大量使用了松节油稀释后的薄涂——颜料几乎是半透明的，画布的底子透过来，让暗部不是'重'而是'透'——像薄薄的脏酒洒在桌布上。人物的脸部都带着一层'绿调子'——在那个年代,煤气灯的光确实是偏绿的——劳特累克是第一个诚实画出'人工光让人变丑'的画家。",
      detail:"画面最右侧边缘——劳特累克的矮小侧影。他戴着圆顶礼帽，走在人群旁边。把自己画进画里不是新鲜事——委拉斯开兹在《宫娥》里也画过自己。但劳特累克的'自画像'和委拉斯开兹的是两个世界：委拉斯开兹站在国王身边，劳特累克在人群边缘一闪而过——不起眼、不参与、不解释。第二个细节：画面中央偏左，一位绿色面孔的舞女——她的脸上有一层不规则的黄绿光斑，像一张'坏掉的面具'。别的画家画舞女画的是'美'——劳特累克画的是粉底下汗流浃背的人。",
      bg:"劳特累克出身法国最古老的贵族家庭之一（图卢兹-洛特雷克伯爵家族），但他天生患有先天性骨骼疾病——两条腿在14岁后停止生长，成年后身高只有1米42。贵族社交圈他融不进去——那些场合需要跳舞、骑马、身高——所以他去了蒙马特。在蒙马特的夜总会、舞厅和妓院里，没有人嫌弃他的身高——因为这里每个人都在逃避某种'正常'。他爱上了红磨坊——每晚坐在角落喝酒、画画、和舞女聊天。1891年他画了红磨坊的第一张海报——一夜成名——全巴黎的墙上都贴着他的画。但他继续喝酒——苦艾酒、干邑、葡萄酒，每天不断。1901年他37岁时被关进精神病院——他在里面凭记忆画了一系列马戏团画作证明自己没有疯——出院后继续喝酒，两个月后死于酒精中毒和梅毒并发症。他死的时候，母亲把他的画室全部烧掉了。我们能看到的，只是烧剩下的。",
      why:"劳特累克把'海报'提升为艺术——他是平面设计和广告画的先驱。在他之前，海报就是海报；在他之后，海报可以是艺术（影响了从穆夏到安迪·沃霍尔的一整条路）。但他更重要的遗产是：他证明了贵族艺术传统中所有'不能画'的东西——酒馆、妓院、舞女的汗、凌晨三点的醉态——都值得被画进博物馆。他以一个'局外人'的身份，画了所有局内人看不见的夜巴黎。"

  ukiyoe: [
    {
      title:"The Great Wave off Kanagawa",titleCn:"神奈川冲浪里",artist:"Katsushika Hokusai",artistCn:"葛饰北斋",year:"c. 1831",size:"25.7 cm × 37.8 cm（木版画）",location:"多家博物馆藏 · 大英博物馆 / 大都会艺术博物馆 / 东京国立博物馆等",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Great_Wave_off_Kanagawa2.jpg/1280px-Great_Wave_off_Kanagawa2.jpg",
      desc:"全世界最著名的日本艺术品——富士山在巨浪的谷底露出雪白的小三角，三艘渔船在浪尖与浪谷之间搏命。北斋用普鲁士蓝画出了海洋最暴烈也最美丽的一瞬。这幅画早已超越了日本——它是全球视觉文化的通用符号。",
      comp:"北斋把画面分为三层：前景是巨浪的'爪'——浪尖卷曲成钩状，像要抓住什么；中景是沉入浪谷的三艘细长渔船——船是笔直的横线，与浪的曲线形成几何对抗；远景是富士山——一座安静的小三角，在最低处。富士山不是这幅画的'主角'——它是'参照物'：没有它，你看不出浪有多大。北斋用富士山的'不动'衬托巨浪的'动'——一动一静之间，整幅画的张力被拉满。浪尖的泡沫飞散成无数碎点——这是北斋从荷兰铜版画里学来的西方透视与写实技巧。",
      light:"光来自画面外的天光——均匀地洒在浪身上。北斋用日本传统的'空押'（karazuri）技术——不加颜料的干压——在浪尖泡沫处做了微微凸起的浮雕效果，光线下泡沫会'发光'。浪身的普鲁士蓝从浅蓝到深蓝分了至少三个色阶——最前方（最靠近观众）的浪尖是最浅的蓝加白，中间是中等蓝，底部是深蓝接近黑——这是西方的明暗法被北斋融进了浮世绘的平面色块里。",
      color:"整幅画的颜色只有五块：普鲁士蓝（浪）、淡黄（天空）、白色（泡沫）、深棕（渔船）、灰蓝（富士山）。这种色彩的克制是浮世绘的标志——不追求色彩丰富，追求色彩的'对'。普鲁士蓝是19世纪初从欧洲传入日本的化学颜料——北斋是第一批大量使用它的浮世绘画家。这种蓝比传统的日本靛蓝更鲜艳、更稳定、更便宜——所以《富岳三十六景》全套46幅才能以平民买得起的价格大量印制。没有普鲁士蓝的工业化生产——就没有这张画。",
      detail:"浪尖的'爪'——最大的那个浪头卷曲成三根钩状的泡沫。近看这些'爪尖'是一簇一簇的小圆点——北斋不是画'浪在落'，而是画'浪在这一瞬间抓了一把空气但什么都没抓到'。如果你盯着右下角渔船上的船夫看——30个船夫全部低着头、紧紧贴着甲板，没有一个人抬头看浪。他们面对的不是'美景'——是死神。第二个细节：天空——北斋用了一种日本画里极少见的渐变：从顶部的深灰慢慢淡化成地平线处的亮黄。这暗示了整个场景的时间：不是正午，是破晓或黄昏——天还没完全亮，浪已经翻起来了。",
      bg:"北斋画《神奈川冲浪里》时已经72岁了。他是江户时代最勤奋的画家——从6岁开始画画，一生用了30多个笔名，画了三万多张。'富岳三十六景'是他1830-1833年间的系列——最初计划36幅，后来因为太受欢迎扩展到了46幅。浮世绘不是贵族艺术——是一个平民买得起的'印刷品'：一张定价约16文（一碗荞麦面的价钱）。欧洲印象派画家们在巴黎的日本商品店里发现浮世绘，为之疯狂——莫奈收藏了北斋的几百幅版画，德加模仿浮世绘的裁切构图，梵高直接临摹了北斋和广重。梵高在给弟弟的信中写道：'所有的印象派画家都受了日本画的影响——这一点怎么强调都不过分。'",
      why:"它是全球最著名的艺术品之一——和蒙娜丽莎、星空并列的那种级别。但它的伟大和别的画不同：它是一张'印刷品'——不是挂在王宫里、而是贴在普通人家墙上的。它证明了'大众艺术'同样可以触及永恒。它还完成了一次不可思议的跨文化循环：日本浮世绘（受中国画影响）→学习了荷兰铜版画的透视→被欧洲印象派疯狂吸收→影响了整个西方现代艺术→然后西方重新发现了日本的传统。一个浪把东西方打成了一片海。"

    {
      title:"Fine Wind, Clear Morning (Red Fuji)",titleCn:"凯风快晴（赤富士）",artist:"Katsushika Hokusai",artistCn:"葛饰北斋",year:"c. 1831",size:"25.7 cm × 38 cm（木版画）",location:"多家博物馆藏",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Red_Fuji_by_Hokusai.jpg/1280px-Red_Fuji_by_Hokusai.jpg",
      desc:"富士山在夏末初秋的清晨，被朝阳染成了红色——天空蔚蓝，山脚还沉在暗色里，山顶已经燃了起来。北斋用最少的线条画出了最纪念碑式的富士山。日本人称这幅为'赤富士'——和'浪富士'（神奈川冲浪里）并列为北斋双绝。",
      comp:"富士山被放在画面正中央——一个近乎完美的等腰三角形从底部直冲而上，山尖几乎碰到画面上缘。山体上没有一棵树、没有一块石头、没有一根线条——只有色块的边界。北斋完全放弃了西方透视——他不要'空间深'，他要'图形强'。山体左侧的亮面（朝阳光面）和右侧的暗面（背光面）的边界是一条微微倾斜的线——它决定了山的'朝向'。山脚线是水平的——稳稳地压在画面下三分之一处。三角形的稳定与水平线的安静——这座山不动，整个世界都围绕它转。",
      light:"光是这个画面的真正主题——不是富士山的'形体'而是朝阳在富士山表面上的'燃烧'。富士山的红色从上到下渐变——山顶是亮红加白，山腰是正红，山脚是暗赭——同一个红色系的明度梯度模拟了太阳从山顶往下'滑'的过程。天空从顶端深蓝渐变到山下淡白——暗示太阳还在很低的位置。北斋在天空里安排了鳞片状的卷积云——每一朵都是同一个方向的细弧线——它们在'呼吸'，和山的静默形成对比。",
      color:"只有三个颜色——红（山）、蓝（天）、白（云+山脚残雪）。'少'是这个画面的全部力量。富士山的红色选择了'辰砂红'——在木版画的色板里是最高温的颜料。北斋用同一块色板印制了不同的渐变深度——这是木版画技术的极限操作。山顶的残雪不是白色——是'留白'（纸的本色），山下树林的深绿用了几条比红色更深的暗线——仅此几笔，就交代了森林的存在。",
      detail:"山顶的三道残雪——它们是画面里仅有的'白'（纸的本色），形成三条不规则的细线从山尖往下延伸。北斋用这三道白把红色的山从'火'拉回了'山'——提醒你这是富士山的雪沟，不是喷发的火山。第二个细节：山脚下的树——北斋只用了几十个小墨点排成一条带子，就交代了森林。没有枝、没有叶——但你知道那是树，不是别的。这种'用最小的象形符号召唤完整认知'的能力，是浮世绘给西方现代绘画最重要的一课。",
      bg:"'凯风快晴'出自中国《诗经》——'凯风自南，吹彼棘心'，凯风就是南风，指夏末初秋的风。北斋用了一个中国古典的题名画了日本最神圣的山，这个知识谱系本身就是东亚文化圈的缩影。'富岳三十六景'全部用富士山作为主题——这在日本艺术史上前无古人。富士山在此之前是宗教朝圣的对象——不是世俗版画的主题。北斋把圣山变成了'每个人都能拥有的印刷品'——这是一种文化的民主化。",
      why:"如果《神奈川冲浪里》是'动'的极致，那《赤富士》就是'静'的极致。北斋用最少的元素画出了最强烈的存在感——富士山像一尊赤红的金字塔占据了整个视野，任何装饰都是多余的。这种'少即是多'的美学影响了从日本画坛到西方极简主义的一整条线索。在北斋之前，人们画山画树画水画云——画一切细节来证明自己的技术；北斋用一块红三角和几条白残雪告诉所有人：技术不是加法，是减法。"
    },
    {
      title:"Sudden Shower over Shin-Ōhashi Bridge and Atake",titleCn:"大桥安宅的骤雨",artist:"Utagawa Hiroshige",artistCn:"歌川广重",year:"1857",size:"36 cm × 24 cm（木版画）",location:"多家博物馆藏",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Hiroshige_-_Sudden_Shower_over_Shin-%C5%8Chashi_Bridge_and_Atake.jpg/1280px-Hiroshige_-_Sudden_Shower_over_Shin-%C5%8Chashi_Bridge_and_Atake.jpg",
      desc:"广重是浮世绘风景画的另一位巨匠。一场暴雨突然降临江户的大桥——桥上的人撑伞狂奔、低头弯腰；桥下的船夫披着蓑衣在雨中划桨。远方的木场被雨幕遮得只剩剪影。广重用倾斜的雨线画出了一场'你能听到声音'的倾盆大雨。",
      comp:"大桥从画面左下角斜向右上方——一条粗黑的木桥把画面切成上下两部分。上半部分是'被雨淋的世界'：桥上的人撑伞弯腰、迎着斜雨狂奔——每个人都是弓形的，和桥的直板形成对抗。下半部分是桥下的河面：一条木筏在雨中缓慢移动，船夫披着蓑衣——节奏从'奔跑'变成了'忍耐'。远处的木场和天空被雨幕压成深灰——没有地平线，只有雨的'厚度'。最绝的是：广重用桥的粗黑横梁在画面左侧形成'画框'——你好像在桥下避雨，透过桥墩之间的缝隙看到了这一切。",
      light:"雨中的光是'消失的光'——天空从淡灰渐变到深黑，说明这是一团正在碾过的积雨云。桥上的行人在雨幕里越来越淡——不是因为他们走远了，是因为雨在加厚。广重用'渐变'（bokashi）技术——在木板印刷时用手推颜料做出不均匀的渐淡效果——让雨幕从上到下有'浓→淡→浓'的变化。这不是单次的暴雨——是暴雨的不同阶段同时在画面上存在。",
      color:"整幅画的色板是'雨的颜色'：深灰（天空）、暗黑（木桥）、淡蓝灰（河面）、土黄（蓑衣）。广重用极其克制的颜色传递了暴风雨中空气的湿度——所有颜色都像被水浸泡过一样饱和度降低。唯一跳出来的是几把纸伞——淡黄和土红——在满幅灰调里像几点微弱的暖光。广重的配色原则和北斋完全不同：北斋要'对比'，广重要'氛围'。",
      detail:"画面正中偏左——一个撑伞的人被风吹得快要失去平衡，一只脚抬起来，身体前倾到几乎要跌倒。在他前面一个人弯腰抓住斗笠——在他后面一个人双手抓紧已经翻起来的伞——三个人三个动作，完整地写出了'风→雨→人'的物理关系。第二个细节：桥下木筏上的船夫——他正在用力撑篙，蓑衣被风吹得张开了像一面帆。桥上的人和桥下的人在不同的空间，经历了同一场雨——广重用这一根看不见的'雨线'把上下两个世界缝合在了一起。",
      bg:"广重1857年创作了这套《名所江户百景》——计划120幅，画到他1858年去世。这是他最后的系列——也是最成熟、最大胆的。《大桥安宅的骤雨》启发了整个西方——梵高1887年临摹了这幅画，几乎一模一样地复制了它（现藏于梵高博物馆）。梵高不懂日文——他甚至在临摹画的两侧加上了他从其他浮世绘里抄来的书法——他不知道那些字是什么意思，他觉得'美'就够了。1887年的梵高还没画出《向日葵》和《星月夜》——他在广重的雨里学习'如何用简单的线条传递巨大的能量'。",
      why:"它是浮世绘对西方影响最直接的例证——梵高的临摹挂在梵高博物馆里，和原作面对面。广重的雨线画法——用平行斜线表现雨——后来成了所有漫画和插画里'画雨'的标准方法。你从童年看到现在的每一部漫画，凡是画下雨的——那些背景里的斜线——都能追溯到广重的这座桥。"
    },

      color:"粉白（梅花）、灰黑（树干）、淡绿（草地）、浅粉（天际）——这四个色块构成了极简而极雅的颜色和弦。梅花不是纯白——是带了极淡的粉紫调，暗示它是'红梅'而非白梅。树干是深灰中带有木纹的刻线——木版画的特殊质感：墨被压入和纸的纤维中，黑不是'涂'上去的，而是'压'进去的。",
      detail:"主树干上凹凸不平的树皮纹理——广重用木版雕刻的刀痕来表现老树皮的粗糙。每一刀都清晰可见——树干不是'黑块'，而是一整片有纹理深浅、有木质温度的'皮肤'。如果你凑近看原版印刷，能看到和纸的纤维从墨色里透出来——这是木版画最迷人的质感：木头+纸+墨，三种自然材料共同完成了这张画。第二个细节：画面远景里，几个小人正仰头赏梅——他们小到几乎看不见（约2毫米高），但每个人都有一根细细的影子投在草地上。广重画这么小的人都没忘记影子——因为影子是'阳光存在'的证明。",
      bg:"龟户梅屋铺是江户东郊龟户天神社内的一处梅花名胜——江户时期的平民在早春来这里赏梅，是当时最流行的休闲活动。广重画《名所江户百景》的逻辑不是'最美的风景'而是'最有名的地点'——他用这个系列记录了江户（今天的东京）每一个被市民喜爱的地方。这不是贵族的美学——是市民的、市井的、日常的。梵高1887年在巴黎临摹了这幅画——他把梅树变成了油画，在原作上增添了他自己从其他浮世绘里借来的日文书法边框。梵高的临摹比原作颜色更浓烈——因为他不是在学习浮世绘，他是在用自己的油画消化浮世绘。",

      desc:"写乐是浮世绘史上最大的谜——他在1794-1795年间突然出现，画了约140幅极其大胆的歌舞伎演员肖像，然后在不到一年后完全消失。没人知道他是谁。这幅画里，演员大谷鬼次扮演的反派江户兵卫——双手张开、面露凶狠、青筋暴起——写乐把歌舞伎表演中最'不美'的瞬间钉在了纸上。",
      comp:"写乐把人物的脸放在画面正中央——没有背景、没有道具——只有一张正在咆哮的脸和两只张开的手。演员的身体被压缩在画面的下半部分——你所有的注意力都被拉向上方的脸。两只手在画面下方张开——五指伸到最大——制造了一种'马上要扑过来'的紧张感。写乐用的是极端的不对称构图——左肩高、右肩低，脸朝左、右肩也朝左——所有的力量都在向左倾泻。和服的纹样在他的构图中被极度简化——他不要装饰抢戏。",
      light:"写乐用了日本画里极其少见的'阴影'——在演员的眼窝、鼻翼两侧、下颌底部，他用灰色的云母粉（mica）做了暗部。这不是西方的明暗法——它是更陡然的、更符号化的'阴影指示'。眼睛里没有高光——瞳孔是全黑的，眼白用纯白——黑白之间没有过渡。这种'没有柔和过渡的光'让人的表情像鬼脸一样被放大了。",
      color:"写乐的色板极其克制——他只用深灰（云母粉做的银灰色背景）、黑（头发、衣服、瞳孔）、白（眼白、纸原色）、淡红（嘴唇、眼角的内侧）。他的色彩不是用来'美化'的——是用来'强化'的。人物的眉毛和嘴唇用极淡的红——嘴角向下咧开，红色被压在下唇的边缘——像一个在怒吼时嘴部充血的瞬间。",
      detail:"演员的双手——十指完全张开，每一根手指的关节都有墨色的勾勒。拇指和食指之间的'虎口'张到了极限——写乐画的手不是优雅的，而是粗壮的、用力的、像要抓碎什么东西的。这两只手在画面的最下方，像两只爪子从下面往上掏。第二个细节：眼角的红色——写乐在眼白和眼睑的交界处画了一道极细的红线——这个细节让整个眼睛'活'了过来：不是一张面具，是一个真正的人在用脸部所有肌肉制造一个'凶相'。歌舞伎表演中，演员需要用极度夸张的面部表情来传递角色性格——写乐把这一瞬间的肌肉扭曲画成了永恒。",
      bg:"1794年5月，江户的三个出版商突然同时推出了28幅歌舞伎演员肖像——全部是一个署名'东洲斋写乐'的新画家画的。没有人见过写乐，没有人知道他从哪来、跟谁学画。他的风格和当时所有的浮世绘都不同——他不美化演员，他画演员在舞台上的'瞬间表情'：狰狞、惊愕、愤怒、狂喜——一切传统肖像画认为'不体面'的表情。江户的观众被震住了——这些画卖得极好。但写乐只活跃了十个月——从1794年5月到1795年2月，画了约140幅作品后突然消失。有理论说他是能剧演员斋藤十郎兵卫——但证据不足。写乐之谜至今未解。",
      why:"写乐是世界上第一个'表情艺术家'——在他之前，肖像画是为了'纪念一个人长什么样'；在他之后，肖像画可以是为了'抓住一个人在那个瞬间是谁'。他的表情捕捉超前了时代将近一个世纪——德国表现主义、法国野兽派、甚至当代的街头摄影，都在不同的时代回到了写乐的这个问题上：'人不是他的长相——人是他的表情。'他的消失和他的出现一样神秘——像一颗流星，在日本艺术史的天空里只亮了十个月，但亮得没人忘得了。"

      title:"The Kiss",titleCn:"吻",artist:"Gustav Klimt",artistCn:"古斯塔夫·克里姆特",year:"1907–1908",size:"180 cm × 180 cm",location:"奥地利维也纳 · 奥地利美景宫美术馆 Österreichische Galerie Belvedere",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg/1280px-The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg",
      desc:"维也纳分离派的巅峰之作。一对恋人跪在悬崖边的花毯上，全身包裹在金箔和装饰性纹样之中——男人的衣袍是黑灰色的矩形图案，女人的裙摆上是五彩的圆和花卉。两人在金色的光芒里融为一体。这是全世界最贵重的吻。",
      comp:"克里姆特把人物压缩在画面的正中央——一个正方形画框里的'拥抱的方碑'。男人的头部在画面上半部分偏右，女人在偏左——两人形成一个微微倾斜的T形。女人的头在画面水平中线以上——她的脸是侧转的，眼睛闭着，嘴唇微启——她不是在接受这个吻，她是'消融'在这个吻里。画面底部是一块窄窄的花毯——绿色、紫色、红色的小花——这是悬崖的边缘。他们跪在花毯上，再往前一步就是深渊。",
      light:"金箔——不是画的'金色颜料'，是真的金箔贴上去的。在美术史里，金色传统上只用于宗教画（圣像的光环、天国的背景）。克里姆特把属于上帝的金箔贴到了两个人拥抱的爱上——他把'爱'提升到了神的高度。光从金箔上向四面八方反射——在美术馆里，你站的位置不同，金色发光的地方就不同——这个吻是'活的'。女人的小腿和脚掌从花毯边缘垂下——这是画面里仅有的未经装饰的皮肤区域——它们没有金箔、没有几何图案——是'赤裸的肉'。",
      color:"金是这幅画的主宰——它的用量远超任何颜料。男人衣袍上的黑与灰白矩形图案（阴性几何）与女人的五彩圆花和螺旋（阳性几何）形成阴阳互补——他是直线，她是曲线。克里姆特让衣服'说话'——你不需要看他们的表情，你只要看她的裙摆上全是绽放的圆——而他的袍子上全是直立的矩形——一个在打开，一个在包裹。背景是暗金和暗棕——整个世界退到了金色薄雾之后。",
      detail:"女人右脚的脚趾——它们从花毯边缘垂下来，五个脚趾在金色背景上构成一个微小的弧线。这是全画最容易被忽略的细节——但也是克里姆特最关键的'人味'。如果她整个人都被金色裹着，她就是神——但她有五根真实的脚趾，脚尖在悬空——所以她还是一个人，跪在悬崖边上被人吻。第二个细节：她的左手——搭在男人的右手上，手指微微回钩但完全没有用力。她不是'抓住'他——她只是'接受'他的手。这是一种极致的不防御。",
      bg:"克里姆特1862年出生于维也纳，是金匠的儿子——所以他用金箔作画顺理成章。1897年他和一群年轻画家从保守的维也纳美术学院脱离出来，成立了'维也纳分离派'（Secession）——座右铭是'每一个时代都需要自己的艺术，每一种艺术都需要自己的自由'。1907年克里姆特画《吻》时已经45岁——刚经历了为维也纳大学画的三幅哲学壁画被教会和媒体群嘲为'色情乱画'的丑闻。他决定不再为公众画画——只为私人客户和他自己。《吻》在展出前就直接被美景宫美术馆买下——这是奥地利国家美术馆第一次在展出前就买了他的画。《吻》是克里姆特在说：'我不管你们怎么骂我——我要画全世界上最美的东西。'",
      why:"它不只是一幅画——它是维也纳这座城市的视觉名片。每年几百万人站在美景宫的这幅画前——他们来自每一个国家、说每一种语言——但不需要翻译。它证明了'装饰性'不属于'真正的艺术'这个偏见是错的——克里姆特把金箔、马赛克、日本图案、拜占庭圣像和奥地利新艺术全部熔在一起，证明'装饰'可以在最高意义上等于'艺术'。"
    },

      title:"Self-Portrait with Physalis",titleCn:"自画像与中国灯笼",artist:"Egon Schiele",artistCn:"埃贡·席勒",year:"1912",size:"32.2 cm × 39.8 cm",location:"奥地利维也纳 · 列奥波多博物馆 Leopold Museum",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Egon_Schiele_070.jpg/1280px-Egon_Schiele_070.jpg",
      desc:"席勒是表现主义最年轻的'鬼才'——他只活了28岁，却在不到十年的绘画生涯里留下了近300幅油画和3000多幅素描。这幅自画像里，24岁的席勒歪着头，眼睛一大一小，手指像蜘蛛的脚一样展开——背景里一株挂着橙色果实的中国灯笼花在和他'对视'。他不是在'看自己'，他是在'解剖自己'。",
      comp:"席勒把自己放在画面的左侧三分之二——右侧留给一株和真人同等比例的中国灯笼花。人和植物'平起平坐'——这不是传统的'人像+背景'构图，而是一种'两个生命体的对话'。他的头极度向左歪斜——脖子的肌腱被拉到了极限——这是一个正常人无法保持超过五秒的姿势。左侧肩膀高耸到耳朵旁——右侧肩膀塌下去——肩部线条形成了一条剧烈的不对称斜线。手指不是并拢的——每一根手指都向不同的方向张开——像被电流击中了一瞬间。",
      light:"没有柔和的光——只有白底（纸原色）上从右上角打来的冷硬亮光。席勒用瘦骨嶙峋的线条画出轮廓后，在身体的边缘（颧骨下方、锁骨窝、指节沟）加了淡赭和淡蓝的水彩——这些颜色不是'肤色'，而是'结构指示'。脸上的高光留白——是高光也是骨头。他画的不是光的柔和，而是骨头撞击皮肤时的尖锐棱角。",
      color:"席勒的色彩像一顿被打翻的调色盘——皮肤是惨白加淡赭，脸的暗面是蓝灰，嘴唇是一抹桃红，左眼眼眶是一圈发炎的暗红。衣服是深灰和土黄的粗布纹理——他穿的不是体面的画家外套，而是一件皱巴巴的灰夹克。右侧的中国灯笼花——薄如蝉翼的橙色外壳包裹着深红果实——那是全画最鲜艳的色彩，也是全画唯一的'生命体'。席勒似乎在说：花比我更有生命。",
      detail:"眼睛——一大一小。左眼（面向观众）瞪得极大，瞳孔深黑几乎没有高光——像要从眼眶里跳出来；右眼藏在歪头的暗面里，眼皮半垂着——像一个对世界已经不再好奇的人。这种'大小眼'不是解剖学错误——席勒在画自我认知的分裂：一个他在疯狂向外看、另一个他已经闭上了。第二个细节：每一根手指的关节——指节是鼓起的，指尖是尖锐的（像没有指甲的爪子），指骨之间的皮肤是凹陷的——他画的手不是'肉手'而是'骨手'，像X光片。",
      bg:"席勒1890年出生于奥地利图尔恩——父亲是火车站站长，在席勒15岁时死于梅毒引发的精神错乱。父亲的死和疯狂是席勒一生的阴影——他在后来所有的自画像里都在找父亲疯掉的痕迹。1906年他16岁考进维也纳美术学院——是学院史上最年轻的学生。1910年遇见克里姆特——克里姆特成了他的导师、朋友和推手，买他的画、介绍藏家、和他交换作品。1912年他因为'诱拐未成年少女'被捕（实际是和一个14岁的女孩私奔），在监狱里关了24天——法官当庭烧了他的一张画——'这种龌龊的东西不配存在'。1918年西班牙流感大流行——10月28日他怀孕六个月的妻子伊迪丝死于流感，三天后（10月31日）席勒也死于流感——他死的时候还不到29岁。他死前的最后一幅画是他和妻子伊迪丝的素描——两人都在画纸上，都闭着眼睛。",
      why:"席勒把'自画像'从'我长什么样'变成了'我是什么感觉'。他的自画像不是镜子里的他——是他用骨头、皮肤和神经画出来的'内在自我的X光片'。所有后来的'痛苦绘画'——从弗朗西斯·培根的扭曲人像到当代的刺青文化——都在席勒的那双大小眼里找到了原初的冲动：美不是好看，美是真实的疼痛。"
    },
    {
      title:"The Cyclops",titleCn:"独眼巨人",artist:"Odilon Redon",artistCn:"奥迪隆·雷东",year:"c. 1914",size:"64 cm × 51 cm",location:"荷兰奥特洛 · 克勒勒-米勒博物馆 Kröller-Müller Museum",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Redon_cyclops.jpg/1280px-Redon_cyclops.jpg",
      desc:"雷东是象征主义的梦中行者——他用一辈子画'不可见的东西'。独眼巨人波吕斐摩斯从碎石山后探出一颗巨大的头颅，一只大眼温柔地俯视着沉睡的仙女伽拉忒亚。这不是希腊神话里的怪物——这是一个庞大的、孤独的、在暗处偷偷爱着一个人的存在。",
      comp:"巨人的头占据了画面上方——只有一颗头、一只眼、一片厚唇——身体完全隐在山后。山不是写实的——是雷东用各色碎点堆成的'梦的质地'。画面右下角，仙女伽拉忒亚赤裸地侧卧在花丛里——她的身体只是一抹淡粉和淡蓝的色晕——没有线条、没有轮廓——像一团光做的雾。巨人（庞大、沉重、暗色、固体）和仙女（娇小、轻盈、亮色、透明）形成了极端的对比——他看着她，她不知道被看着。",
      light:"雷东的光是最难描述的——它不像印象派的自然光，也不像卡拉瓦乔的戏剧光——它是'梦幻自带的光'。仙女的身体发出淡粉色的光（她不是在光里——她自己在发光）；巨人的眼睛是淡蓝的瞳孔配一圈暗红的眼眶——眼睛是唯一'亮的'，其余都在暗色里。山石上的各种颜色像是从内部透出来的——每一块石头都有自己的微光。雷东说：'我的画是让不可见的东西变得可见。'",
      color:"雷东的色板是'梦的色谱'——只有他会用的那些颜色：淡粉、淡蓝、青紫、灰绿、贝壳白、暗赭。所有的颜色都是磨碎的——没有锐利的边界——像一个被记不太清楚的梦。仙女的身体从粉渐变到蓝——这不是人体能有的颜色，但是一个'梦里的裸体'应该有的颜色。山石上的细小色点从远处看像苔藓和野花——近看是雷东一根一根用画笔轻轻点上去的——这不是画山，这是'种'山。",
      detail:"巨人的那只眼睛——全画唯一的'圆'。眼睛不是凶恶的——是忧伤的：瞳孔微微偏下，直直地对着仙女的方向——他的嘴角是下垂的。雷东没有画希腊神话中那个吃人的独眼巨人——他画了一个在角落里偷偷看心上人的、长得太丑不敢现身的'温柔的怪物'。第二个细节：仙女头顶的野花——几朵淡黄和淡粉的小花，花茎细得像发丝——她的睡梦里连一朵花都不敢惊醒她。",
      bg:"雷东1840年出生于法国波尔多，前半辈子只画黑白——炭笔、石版画——全部是黑色、恐怖、诡异的主题（漂浮的眼球、骷髅、人脸蜘蛛）。他说那些是他的'黑色'（les Noirs）——他把全部恐惧都放在里面。1890年代以后他突然转向色彩——粉彩、油画——全部是花、神话、梦、光——他说他的后半辈子是'色彩的恩典'。他等了50年才'看到颜色'。《独眼巨人》属于他的'色彩时期'后期——他用希腊神话画了一段单向的、不被知道的、不要求回应的注视。",
      why:"雷东是所有超现实主义者的'精神祖父'——达利、马格利特、恩斯特全都承认受他影响。他证明了'看不见的世界'是艺术最能发挥的领域——不是画所见的自然，不是画已知的神话，而是画'我闭上眼睛看到的那些东西'。在雷东之前，神话画是历史画的一部分（描绘一个已知的故事）；在雷东之后，神话画可以是一段'没人讲过的事'——比如一只孤独的独眼在深夜的山后看着一个永远不知道他存在的仙女。"
    },
    {
      title:"Portrait of Adele Bloch-Bauer I",titleCn:"阿黛尔·布洛赫-鲍尔肖像一号",artist:"Gustav Klimt",artistCn:"古斯塔夫·克里姆特",year:"1907",size:"138 cm × 138 cm",location:"美国纽约 · 新艺廊 Neue Galerie New York",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Gustav_Klimt_046.jpg/1280px-Gustav_Klimt_046.jpg",
      desc:"被称为'奥地利的蒙娜丽莎'。阿黛尔·布洛赫-鲍尔——维也纳最富有的银行家之妻——端坐在金箔的宝座上，衣袍是密密麻麻的金色几何图案和埃及眼睛符号。她的脸是写实的，身体却融化成了一片奢华的金色织锦。这是维也纳世纪末（fin-de-siècle）最高贵的肖像。",
      comp:"克里姆特把正方形画框分成了三层：最外层是暗金背景（像拜占庭圣像的黄金穹顶），中间层是阿黛尔的裙袍（金与银的织锦，布满螺旋、眼形和矩形符号），最内层是她的脸和手——脸是整个构图中唯一的'具象锚点'。阿黛尔的表情是中性略偏忧郁——嘴唇微抿，眼睛看着你能穿透你——她不需要被'美化'，她的权威来自金箔的加持。裙袍的底部有一小块淡绿色——那是椅子坐垫的边缘——唯一的'现实世界'的线索。",
      light:"金箔——占画面约三分之一面积——不是颜料，是真正的金和银镀上去的。光线在美术馆的射灯下从不同的角度打在金箔上，整个画面会随着你走动而'闪耀'和'暗淡'——你不动就看不到全部的金光，你必须围着它走。阿黛尔的脸是用写实油画画出来的——皮肤的光泽和金色背景的光泽来自完全不同的物理机制——一张画同时用了'反射光'（金箔）和'画出光'（油画）两种语言。",
      color:"金与银是绝对的主角——但克里姆特在织锦图案的边缘加了一层极细的淡蓝和淡粉线条。这些冷色在金色海洋里只占不到百分之二——但如果没有它们，金色就'糊'了；有了这几根冷线，金色的暖被精确地'定'在了那里。阿黛尔的嘴唇是一抹桃红——全画最暖的有机色——在一片金色无机世界里，这一抹红就是生命的宣言。她脖子上的钻石项链用白色和淡蓝的高光画成——它反射着不存在的窗口。",
      detail:"裙袍上的眼睛符号——在阿黛尔袍子的下半部，密布着几十个埃及'荷鲁斯之眼'的变形——一只椭圆的眼睛，瞳孔是一小块深蓝。这些眼睛不仅是装饰——它们在'看'你。阿黛尔的真眼睛看着你——她衣服上几十只眼睛也看着你——你无处可逃。第二个细节：阿黛尔双手交叠在胸前——但她的手指是微微弯曲的（没有伸直），左手无名指上有一枚细金戒指。这个姿势在弗洛伊德的维也纳——一个正在挖掘所有不为人知的欲望的城市——既克制又暗示。",
      bg:"阿黛尔·布洛赫-鲍尔是维也纳最著名的艺术沙龙女主人。她19岁嫁给大她17岁的糖业巨头费迪南德·布洛赫-鲍尔——他们的家是维也纳知识分子和艺术家的聚会所：马勒来弹琴、茨威格来聊天、克里姆特来画画。1903年费迪南德委托克里姆特为阿黛尔画肖像——花了四年，用了几百张草图。阿黛尔在这四年里和克里姆特发展了一段'不明确的亲密关系'——没有任何直接证据，但维也纳全城都在猜。1925年阿黛尔死于脑膜炎，年仅43岁。1938年纳粹吞并奥地利——费迪南德逃往瑞士，把所有财产——包括这幅画——留在了维也纳。纳粹抄走了这幅画，改名'金衣女子'（抹去了犹太人的姓氏）。战后几经辗转，1998年奥地利政府立法归还被纳粹抢夺的艺术品——阿黛尔的侄女玛利亚·阿尔特曼（82岁的犹太难民，住在洛杉矶）决定起诉奥地利政府。官司打了八年，一直打到美国最高法院（奥地利共和国诉阿尔特曼案，2004年）。玛利亚赢了。2006年她把画以1.35亿美元卖给了雅诗兰黛继承人罗纳德·劳德——当时创下了画作拍卖的世界纪录。劳德把它放在纽约新艺廊——阿黛尔的'金衣女子'终于在曼哈顿找到了新家。",
      why:"这是一幅被历史翻了两遍才坐稳的画：第一遍是克里姆特和维也纳世纪末的黄金年代——第二遍是一个82岁犹太老太太为讨回被纳粹抢走的家族财产，和美国政府、奥地利政府、博物馆集团打了八年官司。它证明了艺术品不只有'艺术史'这一个维度——它的产权史、它在战争中被抹去的名字、它在法庭上的证词——都是这幅画的一部分。你在新艺廊里看它的时候，看到的不只是阿黛尔的脸——是克里姆特、维也纳、纳粹、最高法院和玛利亚·阿尔特曼全部叠在一起的这张金箔。"
    },

      bg:"基希纳1880年出生于德国，1905年和朋友们在德累斯顿成立了'桥社'——这个名字来自尼采的《查拉图斯特拉如是说》：'人类是一座桥梁，不是目的。'他们要用艺术做一座从'旧世界'到'新人类'的桥。1911年基希纳搬到柏林，被这座城市的疯狂吞没了——柏林当时是欧洲发展最快的大都市——工业化、城市化、现代性——在基希纳眼里这些不是进步——是'把人变成机器'。他画了一系列柏林街景——每一幅都是一群尖脸人穿着黑大衣往前挤。《柏林街景》是其中最大的、也是最'可怕'的一幅。1937年纳粹把基希纳的639幅作品从德国博物馆里清除，标为'堕落艺术'——1938年他在这片破坏中精神崩溃，在瑞士达沃斯吞枪自杀。",

      bg:"恩斯特1891年出生于德国布吕尔——他父亲是聋哑学校的老师，极其严厉。恩斯特小时候养了一只鹦鹉，鹦鹉死的那天晚上，他的妹妹正好出生——他在后来的自传里说他永远觉得'人和鸟、生和死是混在一起的'——这种混合感就是他全部超现实主义的源头。一战爆发后他应征入伍，在西线战场待了四年——战后他成了达达主义在科隆的灵魂人物。1922年他搬到巴黎，正式进入超现实主义圈子——安德烈·布勒东称他为'超现实主义最伟大的画家'。1941年他从纳粹占领下的法国逃往美国——在纽约和佩吉·古根海姆结婚（两年后离婚）。他的拼贴式绘画影响了整整一代纽约画派。",
      why:"它是第一张真正的超现实主义油画——在布勒东1924年发表《超现实主义宣言》之前三年，恩斯特已经画出了超现实主义的全部配方：拼贴逻辑（不同世界的物件放在一起）、自动书写式的自由联想（一头象=一个锅炉）、与战争记忆的潜意识对话。达利和马格利特走的是'可识别物体的不可能关系'路线——恩斯特走的是'把物体本身的物质性拆掉重建'。他给后来的超现实主义者打开了最自由的一扇门。"

      comp:"达利将画面平分——左半部是'死前'（纳西索斯跪在池边，头垂向水面），右半部是'死后'（一尊石化的巨手握着蛋，蛋裂开水仙从里面探出）。左半部的人是柔和的曲线、身体是暖赭色、倒影在水里扭曲变形；右半部的石头手是硬直线、颜色是灰白——冷得像墓碑。手的轮廓和左边人的弯曲身体完全对称——这就是达利的'双重图像'（double image）：你看左边看到的是一个人，你看右边看到的是一个石头手——但它们的轮廓是同一根曲线。背景是同样的加泰罗尼亚荒山——同样一个世界，分裂成了'生'和'石化'两个版本。",
      light:"左侧的光是温暖的黄昏——纳西索斯的身体笼罩在淡金和暖粉的光里——这是'还活着'时的光。右侧的光是冷白的中午——石头手的每一道裂纹都清晰可见——这是'死后'的光。画面正中央的水面反光——从左侧的暖黄渐变为右侧的冷白——同一池水，连接了两种光、两种状态。水中倒影里纳西索斯的脸被扭曲——眼睛已经变成空洞——他在水里'正在消失'。",
      color:"左侧的暖色群——皮肤的暖赭、地面的暖棕、水面的淡黄——全部是'有机'的暖色。右侧的冷色群——石手的灰白、蛋的淡灰蓝、背景山的冷蓝——全部是'无机'的冷色。画面正中央那朵水仙花——淡黄的花心和白色的花瓣——是左右两种色调的交汇点。它从灰色的石化手里长出来——同时它的柔白又引回左侧的暖色域。八块棋盘格放在画面下方——达利说这是'自动书写'时随手画的——没有寓意——就是为了打破你试图为所有东西找意义的习惯。",
      detail:"水中的倒影——纳西索斯在水面上的倒影不是他的脸——是一个正在崩解的灰色面具：两眼的黑洞、鼻子和嘴正在碎成粉末、碎片落入水中。达利用这个细节讲了一个残酷的故事：纳西索斯不是'看到自己的倒影然后爱上它'——他是'看到自己的倒影正在死去然后爱上死亡'。第二个细节：右侧石头手里蛋的裂口——蛋壳裂成两半，裂缝呈现出不规则的锯齿形——从裂缝里伸出来的不是'一朵花'而是'一根细长的花茎'——这茎在寻找光、在往外延伸——达利在说：死亡和变形是同一件事——蛋是死的（石头），花是活的——死不等于结束，死是变形成另一种活着。",
      bg:"1937年达利已经是超现实主义最红的明星。他发展了一种称为'偏执狂批判法'（paranoiac-critical method）的创作技术——通过主动触发偏执狂式的幻觉来'看到'一个物体里藏着的另一个物体（比如石头手的轮廓和一个蜷缩的人的轮廓之间的'双重图像'）。他和弗洛伊德在伦敦见了面——达利把《纳西索斯的变形》带过去给弗洛伊德看。弗洛伊德——从来不喜欢超现实主义的——看了这幅画后在给茨威格的信中写道：'直到现在，我才倾向于认为超现实主义者的确有严肃的心理学洞察。'",
      why:"它是达利最'聪明'的画——没有软钟、没有燃烧的长颈鹿——只有希腊神话在20世纪加泰罗尼亚荒野里的第二次降生。达利把双重图像（double image）推到了极限——一幅画同时是两个完全不同的画面——你看左边的时候和看右边的时候，大脑在'切换频道'——这种'感知切换'是达利对超现实主义最原创的贡献。"

      color:"下方：暗黑、深绿、暖橙（灯光）——夜晚的颜色。上方：纯蓝、亮白（云）——白天的颜色。黑和蓝的比例大约是1:1——各占一半画面面积——没有一个'主导时间'。暖橙的路灯是唯一的'桥梁色'——它在夜色里发光——但你如果在白天看路灯它不会这么亮——所以这盏灯同时属于和不应该属于这个场景。天空的蓝用了马格利特最标志的'硬蓝'——平涂、不渐变、没有空气透视——它不模仿大自然，它'是'蓝色本身。",

      desc:"米罗的超现实主义和达利或马格利特完全不同——他不需要'写实'。他创造了一个由弯曲的线条、圆形的色块和单细胞生物般的'虫形'组成的'狂欢节'。一个小丑（Harlequin）被一群奇形怪状的小生物包围——他们在米罗的心智里开了一场没有重力的派对。",
      comp:"米罗的画法叫'自动书写'（automatism）——他让手在半意识状态下自由移动，画出线条，然后顺着手留下的痕迹'发明'出各种小生物。画面没有透视、没有重力、没有上下——就是一个狭窄房间里漂浮着几十种'米罗生物'。中央偏左是一个像吉他一样的丑角——他的胡子是用两根细线画成的、嘴上叼着一根长长的烟斗。周围是猫、鱼、鸟、虫、梯子、音符和轮子——它们互相不打扰——各自在同一个房间里忙着自己的事情。左上角有一扇窗——窗外是一个蓝色的三角（天空）——这是全画唯一暗示'外部世界'存在的线索。",
      light:"光是无重力的淡黄背景——米罗的底色不是天空不是墙壁——是一块'发光的空白'。所有的小生物都有自己的阴影颜色——暗红、深蓝、墨黑——它们像剪纸一样贴在发光背景上。米罗不让光制造立体感——他让光制造'平面上的节奏'。你的眼睛在不同的色点之间跳跃——光就是这种'跳跃感'而不是'照明'。",
      color:"米罗的色板是一组饱和的原色：朱红、群青、柠檬黄、草绿、纯黑、纯白。所有颜色都不混合——它们以纯粹的、化学般的强度在米黄色的背景上弹跳。红色的音符和蓝色的昆虫形成补色对抗——就像爵士乐里的小号与低音贝斯的对话。左上角蓝色三角窗暗示'外部的天空是冷的'——房间内部是'暖的'——所有生物都是温血动物。",
      detail:"画面左侧——一个像毛毛虫一样的长条生物——它的身体是一串红蓝黄绿的彩色方块，每个方块之间有一根极细的黑线连接——像'脊柱'。这个生物在地面上爬行——它是全画唯一的'水平运动'——其他生物都在垂直飘浮或者打转。第二个细节：画面右侧——一架梯子靠在墙上，梯子顶端什么东西都没有——它通向'画面之外的什么地方'。米罗说这架梯子是'逃出画面的通路'——是超现实主义要从现实理性中'越狱'的隐喻。",
      bg:"米罗1893年出生于巴塞罗那——他是超现实主义创始团体里唯一一个西班牙人。1920年代初期他在巴黎过着穷困潦倒的日子——住在布洛梅街45号的一个没有暖气的阁楼里。他说他在饿肚子的时候，墙上会出现幻象——那些弯弯曲曲的生物就是他饿得半昏时看到的'墙上的裂缝和污渍变成的东西'。他用自动书写法画下了整整一个墙上的米罗生物群——这幅画花了他将近一年——每一个生物都经过了几十次调整（他先在纸上画无数草稿，再转移到画布上）。1925年这幅画在巴黎皮埃尔画廊展出——布雷东立刻买下了它——并宣布米罗是'我们中间最超现实的一个'。",
      why:"米罗走出了超现实主义的第三条路：达利用'写实'画梦，马格利特用'写实'画悖论，米罗用'符号'画潜意识本身。他画的不是'梦的内容'（达利的软钟、马格利特的苹果），而是'梦的语言'——那种没法用词汇描述的、半抽象半具象的、每个人都在梦里见过但不记得的'生物形态'。米罗后来成了所有抽象表现主义者（从波洛克到罗斯科）的灵感来源——他们都在米罗的狂欢节里学到了一个教训：颜色和形状不需要'代表'任何东西——它们自己就是生命。"

      title:"Along the River During the Qingming Festival",titleCn:"清明上河图",artist:"Zhang Zeduan",artistCn:"张择端",year:"c. 1085–1145",size:"24.8 cm × 528.7 cm（手卷）",location:"北京 · 故宫博物院",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/%E6%B8%85%E6%98%8E%E4%B8%8A%E6%B2%B3%E5%9B%BE.jpg/1280px-%E6%B8%85%E6%98%8E%E4%B8%8A%E6%B2%B3%E5%9B%BE.jpg",
      desc:"全世界最著名的中国画——一幅5米多长的手卷，画了北宋首都汴京（今开封）清明时节的城市全貌。画面上有814个人物、170多棵树、60多头牲畜、30多栋房屋、28艘船、20多辆车——从郊外的农田到城内的商铺，从运粮的漕船到虹桥上拥挤的人群，北宋的城市生活被一毫米一毫米地钉在了绢上。",
      school:"风俗画——中国画科里最贴近'人'的一种。魏晋以来，中国画主要是山水、人物、花鸟三大科，'风俗画'始终是边缘——张择端把边缘变为了中心。它不属于文人的'书斋山水'传统——这幅画是奉宋徽宗旨意而画，献给皇帝的'北宋盛世全景图'。它是中国艺术史上最宏大的纪实绘画。",
      technique:"张择端在绢上以极细的毛笔和白描法（只用线条、不设色或极少设色）画下了这座巨大的城市。线条是这幅画的全部语言——人物的面部只有2-3毫米大，但每个人都有自己的动作和姿态；虹桥上的每一个人都在做不一样的事（撑伞的、挑担的、骑马的、抱小孩的）。船上的绳索——每一条都有绷紧的张力——你看着就知道哪条绳子在受力、哪条是松的。他用的是'工笔画'的技法——每一根线条都经过深思熟虑——不是文人写意的'草草几笔'。",
      brush:"墨线是这幅画唯一的语言——整幅画几乎不设色（只在少数地方用了淡赭和淡绿点染）。张择端的线条是叙事性的：人物的衣纹线在飘（说明有风），树木的枝桠在分叉（说明是春天的嫩枝），河水的波纹在回旋（说明虹桥下的水流很急）。北宋工笔画的笔法最高境界叫'骨法用笔'——线条不是'描'而是'写'——张择端的每一根线都有骨力——它就是北宋工笔的'骨'。",
      placement:"手卷式构图——从右到左阅读，像一个移动的摄影机。画面从右端（郊外）开始——几棵老树、一队驴队、一个赶路的行人——然后穿过郊区农舍——进入汴河上的虹桥（全画的高潮）——桥上的轿夫和骑马的官员正在抢道——再进入城门——最后是城内繁华的商铺、客栈和茶馆。画面没有'中心'——它是一段'旅程'：你的眼睛从右向左走，像在汴京的街上散步。这种'移动的视点'（散点透视）是中国画对世界视觉文化最独特的贡献——你不需要'站'在一个地方看，你可以'走'着看。",
      rhythm:"全画的'气'在虹桥那一块最紧——桥上轿马争道、桥下一艘漕船的桅杆即将撞上桥洞（船夫们在拼命放倒桅杆）、岸边的人在朝船喊叫——这个瞬间是全画最紧张的节点。过了虹桥，进了城门，节奏慢下来——商铺里的人坐着喝茶、算命先生摊位上有人排队——城内的节奏是安详的。张择端用一座虹桥把'急促'和'从容'隔开——桥外是赶路的人，桥内是安坐的人。",
      poetry:"画上没有张择端的亲笔题诗——只有卷末一段极小的楷书署名：'张择端制'——'制'这个字在北宋的语境里是'奉命制作'——他是以'画师'的身份画的，不是'文人'。北宋画院制度下的画家不是'艺术家'，是'技术官僚'——他们奉命画画。所以这幅画的'诗意'不在诗文里——在画面本身：你不需要读诗——你只要从右到左走一遍汴京的街，你就'读'了北宋——每一间铺子、每一张桌、每一只船都在'说话'。",
      why:"它是中国画里最有'时间'维度的一幅——不是因为它的历史年代（八百多年），而是因为它把一整个城市的某一瞬间全部锁在了一张绢上。你可以在上面看一整天——每次都发现新的细节：原来那个角落里有一个人在掏耳朵，原来这个楼上有个人在晾衣服。它不是画——它是一个被压扁了的北宋汴京。研究宋代城市史、服装史、建筑史、造船史、饮食史的学者都必须经过这张画——它是全人类最详尽的'中古都市图像档案'。"

    {
      title:"Dwelling in the Fuchun Mountains",titleCn:"富春山居图",artist:"Huang Gongwang",artistCn:"黄公望",year:"1347–1350",size:"33 cm × 639.9 cm（手卷，剩山图 + 无用师卷）",location:"台北 · 国立故宫博物院（无用师卷）+ 杭州 · 浙江省博物馆（剩山图）",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Dwelling_in_the_Fuchun_Mountains.jpg/1280px-Dwelling_in_the_Fuchun_Mountains.jpg",
      desc:"黄公望是元代文人画的最高代表——他79岁开始画这幅画，花了三年多，断断续续、添添改改。富春江沿岸的山水不是一次画完的——他想起来就画几笔，出去看山回来再画几笔。这幅画曾被烧成两截——各自飘零了三百多年——2011年两截在台北故宫重逢。这是中国文人画的'圣经'。",
      school:"文人山水画——元代文人画的最高典范。宋代山水画（如范宽）是'画出山的真貌'——元代文人画是'画出心中的山水'。元代是外族统治（蒙古人的元朝），汉族文人被排斥出官场——大量文人不再考科举，退隐山林。黄公望一生不得志——做小官入过狱——出狱后皈依全真教，在富春江边隐居。他的人和他的画是不可分离的：'画不是职业——画是生命在纸上的延长。'",
      technique:"黄公望用的是'披麻皴'——用长线条（像披散的麻绳）平行地画出山体的土质和植被。北宋的皴法是为了画'岩石的硬'（范宽的雨点皴、郭熙的卷云皴），黄公望的披麻皴是为了画'江南土山的润'。他用了'渴笔'——笔上墨少，在纸面上拖出干涩的飞白——这种干笔在纸上的摩擦感是文人画最珍视的'笔触温度'。他还用了淡墨层层积染（'积墨法'）——不是一次画成，而是一遍一遍地往上加——每一遍都不一样——三年多的断断续续不是'没画完'，而是'每一笔都是那一天的记录'。",
      brush:"笔墨是文人画的全部灵魂——'笔'是'写的'（不是描的），'墨'是'活的'（不是平的）。黄公望以书法入画——他的每一根线条都是从草书和行书里长出来的。山石的轮廓线不是'勾'出来的——是'写'出来的——有提顿、有转折、有藏锋——你在一根线里能读到他运笔的速度。墨色从浓到淡至少有七八个层次——前景的山石是焦墨（最深），远处的山是淡到几乎只有水痕的'清墨'——他用墨的深浅造出了'空间'——不是西方透视的空间，而是'墨的呼吸空间'。",
      placement:"画面极长（6米多）——从右到左，富春江的景色缓缓展开。画里没有'主峰'——没有中心——山水连绵不绝——你从左看到右，没有高潮，没有开始，也没有结束。这是'平远法'山水——水平延伸、层层推后——不像范宽那样的高远巨碑，而是一条流动的河。画面上大量留白——江水是白的（纸原色）、远山之间的雾气是白的——'无画处皆成妙境'——留白让全画'透气'。",
      rhythm:"富春山居图不讲'戏剧性'——它是全中国最'平淡'的画——山水静静地展开，不急不躁，没有一个人物——只有山、水、树、沙洲。但它的'气'在纸面上流转——你从左到右'走'一遍，你的呼吸会变慢。黄公望用三年的时间把'时间'本身画进了画里——这幅画的节奏就是富春江的水流的速度——它不是静态的——它是'持续地流动'的。2011年台北故宫让分离了360年的两段画卷合璧展出——那不是一个展览，那是一个仪式。",
      poetry:"画上有黄公望自己的题跋——这是文人画的标志：'画+诗+书+印'四位一体。他在题跋里说：'至正七年（1347年），仆归富春山居，无用师偕往，暇日于南楼援笔写成此卷。兴之所至，不觉亹亹，布置如许。'他承认自己画了很久——想画的时候画几笔，不想的时候放在那里——三年后才交给'无用师'（他的禅友）。'无用'是这个禅师的名字——但也是这幅画的精神：'无用'——不为卖、不为名、不为传世——只是画给自己和禅友看。",
      why:"它是中国文人画的最高峰——此后六百年，所有学文人画的画家都是黄公望的'学生'。董其昌看了富春山居图后说：'吾师乎！吾师乎！'——把它捧为文人画的圣经。明末收藏家吴洪裕爱这幅画爱到死——临终前命人把画烧了'殉葬'——他的侄子从火中抢出了这幅画——但已经被烧成两截。从此'剩山图'（开头的一小段）和'无用师卷'（主体）分隔——各自辗转数百位藏家之手——2011年终于在台北故宫重逢，全世界为之震动。一幅画在火中分成两半、飘零三个半世纪后重逢——这个故事的伟大程度已经分不清是艺术还是传奇。"

    {
      title:"Early Spring",titleCn:"早春图",artist:"Guo Xi",artistCn:"郭熙",year:"1072",size:"158.3 cm × 108.1 cm",location:"台北 · 国立故宫博物院",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Guo_Xi_-_Early_Spring_%28large%29.jpg/1280px-Guo_Xi_-_Early_Spring_%28large%29.jpg",
      desc:"郭熙是北宋山水画的理论家和实践者——他写了一本《林泉高致》，把山水画的美学总结成了完整的理论体系。这幅《早春图》是他的理论在绢上的实现——冬末春初，山在解冻，雾在升起，树木从枯枝中迸出新芽。整座山像一只正在舒展的巨兽——你站在画面前能感到空气的湿度在变。",
      school:"山水画——北宋宫廷画院山水。郭熙是神宗朝（1068-1085）的翰林图画院待诏——北宋皇家画院的最高级画师。他的身份决定了这幅画的定位：宫廷山水——比文人山水更'体制内'——但比之前的宫廷山水更'个人化'。他画的不是'某座具体的山'——他画的是'理想的山'——是神宗皇帝想要在宫殿墙壁上看到的'天下太平的山水'。",
      technique:"郭熙独创了'卷云皴'——用毛笔的侧锋在画面上画出旋转的、像是卷起来的云一样的皴纹。当你近看山石——石头的纹理是打圈的、是旋转的——像石头的内在张力被释放了出来。他也用了'蟹爪树'——冬季的枯树枝像螃蟹的爪子一样向四面八方伸展。松树的松针用'攒针法'——毛笔蘸浓墨，一笔一顿地画出成丛的松针。",
      brush:"郭熙的笔是'活'的——他的山不是'堆'起来的——是'长'起来的。主峰从画面中央升起——两侧的山体向左右倾斜——形成一种'拥抱'的形状。他用墨的湿度制造了'早春的空气感'——淡墨渲染的雾气从山谷中升腾——山腰被雾气环绕——这雾气不是'留白'——是用极淡的湿墨渲染出来的——你感到的是'湿润'。他的树——枝桠是枯的（冬天的残留），但枝头已经开始冒新芽（春天的信号）——这种'介于冬与春之间的暧昧'是他的全部魔术。",
      placement:"郭熙发明了'三远法'——被后世奉为山水画构图的金科玉律。'高远'：从山脚仰望山顶——山主峰在画面上方，压迫感来自垂直高度。'深远'：从山前望向山后——层叠的山谷一层推一层，视线被吸到最深处。'平远'：从近山望向远山——水平渐淡、渐远、渐无。《早春图》是'三远同时存在'的典范——主峰是高远（你仰望它），中景的山谷是深远（你穿过它），远方的淡山是平远（你眺望它）。你同时看到了三个'远'——这种空间体验在西方绘画中完全不存在。",
      rhythm:"早春的'气'在全画里流转——从山脚的溪流（水在动），到中景的瀑布（水在落），到山腰的云雾（气在升），到山顶的天空（气在散）。水→雾→云→空——四个状态是同一个东西的不同阶段——这是中国山水画的'气韵'——不是画空气，而是画'生气贯穿'。《林泉高致》里说：'山以水为血脉，以草木为毛发，以烟云为神彩。'山是一个活的有机体。",
      poetry:"郭熙的儿子郭思把父亲的谈话和笔记编成了《林泉高致》——这是中国历史上第一部系统的山水画理论著作。郭熙提出：'世之笃论，谓山水有可行者、有可望者、有可游者、有可居者。画凡至此，皆入妙品。'——山水不仅要'可看'，还要让你想走进去。他在画面上方用清秀的楷书题了画名和年月——这是北宋宫廷画的规矩——和后来文人画的狂草题跋完全不同——克制、端正、不抢画。",
      why:"它和范宽的《溪山行旅图》并称为北宋山水双璧——范宽是'雄浑'的极致，郭熙是'灵秀'的极致。更重要的是：郭熙不是只会画画——他还会'写'画画。《林泉高致》把中国山水画从'手艺'变成了'可传承的理论体系'——三远法影响了此后九百年中国画的全部构图逻辑。每一个学画山水的人，从南宋的梁楷到今天的中央美院学生，都必须从'三远'开始理解什么是'中国式的空间'。"

      title:"Lotus and Waterfowl",titleCn:"荷花水鸟图",artist:"Bada Shanren (Zhu Da)",artistCn:"八大山人（朱耷）",year:"c. 1690",size:"114 cm × 38.6 cm",location:"北京 · 故宫博物院 / 多家博物馆藏（多版本）",
      url:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Zhu_Da-Lotus_and_waterfowl.jpg/1280px-Zhu_Da-Lotus_and_waterfowl.jpg",
      desc:"八大山人是中国艺术史上最孤绝的'个体户'——他是明朝皇室后裔，明朝灭亡时他19岁，从此装聋作哑、出家为僧、在画里活了一辈子。这幅画只用了寥寥几十笔：一片巨大的荷叶从上方垂下，一朵莲花孤零零地开在旁边——一块危石上站着一只翻白眼的鸟。它不是'花鸟画'——它是一个亡国皇族用寥寥几笔写下的'精神自传'。",
      school:"花鸟画（写意）——但八大山人的花鸟和宋代的工笔花鸟是完全不同的物种。宋代花鸟是对自然的精微观察（'格物'），八大山人的花鸟是个人情感的爆发（'写我'）。他属于明末清初的'遗民画家'——明朝皇室后裔在清朝活下来的一群特殊文人——他们不仕清朝——在画里维持着破碎的自我。八大不是'画家'——他是'以画存活的人'。",
      technique:"八大的技巧可以用四个字概括：'减笔画法'——用最少的笔制造最大的力量。荷叶只用侧锋刷出——一笔含浓淡——笔根是浓墨、笔尖是淡墨——运笔时随着手的转动自然产生墨色的变化。荷茎是一根从上到下的中锋线条——一笔拉下来——没有停顿、没有修改——你不小心呼吸重了这根线就会抖。山石用极干的渴笔画轮廓——飞白累累——石头的'硬'不是在形状上——是在笔触上。",
      brush:"毛笔在八大山人手中相当于'心电图'——他每一笔的轻重、疾徐、干湿——都是他的情绪的实时记录。他画的眼睛是'反'的——一般的鸟是黑眼珠白眼眶——他画的是白眼珠黑眼眶——瞳孔被挤成一个小点顶在眼眶上角——这是中国画史上最著名的'白眼'——翻给整个世界看的。他的线条从来不是匀的——一根线从粗到细到更粗再到飞白——像呼吸一样不均匀——这种不均匀就是'生命感'：完美均匀的线条是机器的——八大的线是活的。",
      placement:"全画只有四样东西：一片荷叶（上）、一根荷茎（竖）、一块危石（中）和一只鸟（石上）。其余全是留白——空白面积超过全画的70%——这空白不是'没有画'——是'无限的空间和时间'。荷叶从上方垂下来压住了画面上部——它的下方是'空'的。鸟站在石头上——石头孤悬在画面中央——下面是更深的空。这种'上压下空'的不稳定性让全画充满了'悬'的紧张感——鸟随时会掉下去，荷叶随时会塌下来。但八大山人用一根荷茎——细细地穿过整幅画面——把所有散落的部分'缝'在了一起——这根线就是他自己。",
      rhythm:"整幅画的节奏来自'重与轻'的对抗。上方荷叶是'重'的——大侧锋浓墨猛刷——压顶之势；中间石头上那只鸟是'聚合'的——它缩着脖子、收着爪子——承受着上方的压力；再下方是空白——完全的空——把所有的重量都托住了。这节奏就是八大山人的内心：亡国的重压（荷叶）、孤独的忍耐（鸟）、不可言说的空虚（空白）——一幅画三种精神状态。",

// ═══════════════════════════════════════════
// LOGIC — flat sequential: one painting per day
// ═══════════════════════════════════════════

const START_DATE = new Date(2026, 4, 20); // May 20, 2026 = day 0

function buildFlatIndex() {
  const keys = ["renaissance","baroque","romanticism","impressionism","postimpressionism","ukiyoe","symbolism","surrealism","chinese"];
  const list = [];
  for (let i = 0; i < UNITS.length; i++) {
    const paintings = PAINTINGS_DATA[keys[i]] || [];
    for (let j = 0; j < paintings.length; j++) {
      list.push({ painting: paintings[j], unit: UNITS[i], dims: UNITS[i].dims });
    }
  }
  return list;
}

const ALL_PAINTINGS = buildFlatIndex();

function getDailyPainting() {
  // Allow ?day=N & ?unit=N to preview
  const params = new URLSearchParams(window.location.search);
  const dayPreview = params.get('day');
  const unitPreview = params.get('unit');
  let idx;
  if (dayPreview !== null) {
    idx = parseInt(dayPreview) % ALL_PAINTINGS.length;
  } else if (unitPreview !== null) {
    // jump to first painting of the given unit
    const keys = ["renaissance","baroque","romanticism","impressionism","postimpressionism","ukiyoe","symbolism","surrealism","chinese"];
    const targetKey = keys[parseInt(unitPreview)];
    idx = ALL_PAINTINGS.findIndex(item => PAINTINGS_DATA[targetKey] && PAINTINGS_DATA[targetKey].includes(item.painting));
    if (idx < 0) idx = 0;
  } else {
    const now = new Date();
    const dayDiff = Math.floor((now - START_DATE) / 86400000);
    idx = ((dayDiff % ALL_PAINTINGS.length) + ALL_PAINTINGS.length) % ALL_PAINTINGS.length;
  }
  return ALL_PAINTINGS[idx];
}

function loadPainting(p, dimsType) {
  if (!p) return;
  const img = document.getElementById("artImg");
  const spinner = document.getElementById("spinner");
  spinner.style.display = "block";
  img.src = p.url;
  img.alt = p.titleCn;
  img.onload = () => { spinner.style.display = "none"; };
  img.onerror = () => { spinner.style.display = "none"; };
  document.getElementById("artTitle").textContent = p.titleCn + " · " + p.title;
  document.getElementById("artMeta").textContent = p.artistCn + " (" + p.artist + ")  " + p.year;
  document.getElementById("artDesc").textContent = p.desc;

  const isChinese = dimsType === "chinese";
  const labels = isChinese
    ? ["画科归属","技法语言","笔墨精神","位置经营","气韵与留白","诗书画印","为什么传世","真迹档案"]
    : ["构图密码","光影魔术","色彩配方","一笔定乾坤","时代背景","凭什么传世","真迹档案"];
  const keys = isChinese
    ? ["school","technique","brush","placement","rhythm","poetry","why"]
    : ["comp","light","color","detail","bg","why"];
  const dims = document.getElementById("dims");
  let html = "";
  for (let i = 0; i < labels.length; i++) {
    let val;
    if (i === labels.length - 1) {
      val = [];
      if (p.size) val.push(p.size);
      if (p.location) val.push("现藏于 " + p.location);
      val = val.join("　");
    } else {
      val = p[keys[i]] || "";
    }
    html += '<div class="dim"><div class="dim-label">' + labels[i] + '</div>';
    html += '<div class="dim-body">' + val + '</div></div>';
  }
  dims.innerHTML = html;
}

function render() {
  const entry = getDailyPainting();
  const daily = entry.painting;
  const unit = entry.unit;
  const dimsType = entry.dims;

  document.getElementById("unitBadge").textContent = unit.name + " · " + unit.nameEn;

  const now = new Date();
  const weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("dateStr").textContent =
    now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日 · " + weekdays[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();

  const dayOfMonth = now.getDate();
  const q = QUOTES[(dayOfMonth - 1) % QUOTES.length];
  document.getElementById("qZh").textContent = q.zh;
  document.getElementById("qEn").textContent = q.en;
  document.getElementById("qRu").textContent = q.ru;

  if (daily) { loadPainting(daily, dimsType); }

  // lightbox — click-to-zoom, drag-to-pan
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lightboxImg");
  const lbStage = document.getElementById("lightboxStage");
  let lbScale = 1, lbPanX = 0, lbPanY = 0, dragging = false, dragStartX, dragStartY, panStartX, panStartY;

  function applyLbTransform() {
    lbImg.style.transform = 'translate(' + lbPanX + 'px,' + lbPanY + 'px) scale(' + lbScale + ')';
  }

  function resetLb() {
    lbScale = 1; lbPanX = 0; lbPanY = 0;
    lbImg.style.maxWidth = '90vw';
    lbImg.style.maxHeight = '85vh';
    lbImg.style.objectFit = 'contain';
    lbImg.style.transform = '';
  }

  function zoomAt(s, cx, cy) {
    const oldScale = lbScale;
    lbScale = Math.max(.6, Math.min(s, 6));
    lbPanX = cx - (cx - lbPanX) * (lbScale / oldScale);
    lbPanY = cy - (cy - lbPanY) * (lbScale / oldScale);
    lbImg.style.maxWidth = 'none';
    lbImg.style.maxHeight = 'none';
    lbImg.style.objectFit = 'none';
    applyLbTransform();
    if (lbScale > 2) loadHiRes();
  }

  let lbHiResLoaded = false;

  function loadHiRes() {
    if (lbHiResLoaded) return;
    // Special:FilePath with ?width=1280 → remove param for full resolution
    let src = document.getElementById("artImg").src;
    src = src.replace(/\?width=1280/, '');
    const hiImg = new Image();
    hiImg.onload = () => {
      lbImg.src = src;
      lbHiResLoaded = true;
    };
    hiImg.src = src;
  }

  document.getElementById("rightPanel").onclick = () => {
    // Start with the already-loaded thumbnail for instant open
    lbImg.src = document.getElementById("artImg").src;
    lbHiResLoaded = false;
    resetLb();
    lb.classList.add("open");
    // Preload hi-res in background
    loadHiRes();
  };

  function closeLb() { lb.classList.remove("open"); resetLb(); }
  document.getElementById("lightbox").onclick = function(e) { if (e.target === lb || e.target === lbStage) closeLb(); };
  document.querySelector(".lightbox-close").onclick = closeLb;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLb(); });

  // Click on image → zoom in at that point
  lbImg.addEventListener("click", function(e) {
    e.stopPropagation();
    if (dragging) return;
    const rect = lbStage.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    if (lbScale >= 5.5) {
      // Already max zoom — reset to fit
      resetLb();
    } else {
      zoomAt(lbScale + 1, cx, cy);
    }
  });

  // Drag to pan when zoomed
  lbImg.addEventListener("mousedown", function(e) {
    if (lbScale <= 1) return;
    e.preventDefault();
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = lbPanX; panStartY = lbPanY;
    lbImg.style.cursor = 'grabbing';
  });
  window.addEventListener("mousemove", function(e) {
    if (!dragging) return;
    lbPanX = panStartX + (e.clientX - dragStartX);
    lbPanY = panStartY + (e.clientY - dragStartY);
    applyLbTransform();
  });
  window.addEventListener("mouseup", function() {
    dragging = false;
    lbImg.style.cursor = lbScale > 1 ? 'grab' : 'zoom-in';
  });
  lbImg.addEventListener("mouseenter", function() {
    lbImg.style.cursor = lbScale > 1 ? 'grab' : 'zoom-in';
  });

  // +/- buttons
  document.getElementById("zoomIn").onclick = function(e) {
    e.stopPropagation();
    const r = lbStage.getBoundingClientRect();
    zoomAt(lbScale + 0.5, r.width / 2, r.height / 2);
  };
  document.getElementById("zoomOut").onclick = function(e) {
    e.stopPropagation();
    if (lbScale <= 1) { resetLb(); return; }
    const r = lbStage.getBoundingClientRect();
    zoomAt(lbScale - 0.5, r.width / 2, r.height / 2);
  };

  // Double-click to reset
  lbImg.addEventListener("dblclick", function(e) {
    e.stopPropagation();
    resetLb();
  });

  // Trackpad: pinch = zoom, two-finger swipe = pan
  lbStage.addEventListener("wheel", function(e) {
    e.preventDefault();
    if (e.ctrlKey) {
      // Pinch-to-zoom (macOS sends ctrlKey=true for pinch)
      const rect = lbStage.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      zoomAt(lbScale * (1 - e.deltaY * 0.005), cx, cy);
    } else {
      // Two-finger swipe = pan
      if (lbScale <= 1) return;
      lbPanX -= e.deltaX;
      lbPanY -= e.deltaY;
      applyLbTransform();
    }
  }, {passive: false});
}

render();
</script>
</body>
</html>
